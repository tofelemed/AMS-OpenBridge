# Plan 04 item 7 — nginx serves the STATIC SPA ONLY.
#
# Every dynamic path (/api, /hubs, /mqtt-ws, /health) passes to the API gateway,
# the single policy point for the estate: edge JWT validation + revocation,
# per-client rate limiting, response caching, body limits, circuit breaking
# (src/services/gateway). nginx makes no routing/rewrite/security decisions.
#
# Gone deliberately (GW-01):
#   - the 11 per-service upstreams + rewrites (the gateway owns the route map)
#   - /swagger (gateway serves it only when Gateway__ExposeSwagger=true)
#   - /external-api (hardcoded LAN IP; no consumer in src/ — config-driven at
#     the gateway if ever needed again)
server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 ipv6=off valid=10s;

    set $gateway http://gateway:8080;

    # CHG-023 (P3-7): compress JSON/JS/CSS. The CPM heatmap is ~100 KB of JSON per poll
    # and compresses ~10×; gzip_proxied any is required because the API bodies come from
    # the gateway via proxy_pass. WebSocket upgrades (/hubs, /mqtt-ws) are unaffected.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    # ── Static SPA ───────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ── API surface → gateway ────────────────────────────────────────────
    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (WebSockets/SSE) → gateway → ams-api
    location /hubs/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # MQTT over WebSocket → gateway (which authenticates the upgrade and
    # rewrites /mqtt-ws → /mqtt for EMQX; no rewrite here).
    location /mqtt-ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /health {
        proxy_pass $gateway;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
