server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 ipv6=off valid=10s;

    set $ams_api      http://ams-api:8000;
    set $hist_bff     http://historian-bff:8090;
    set $emqx_ws      http://emqx:8083;
    set $display_svc  http://display-service:5000;
    set $binding_svc  http://binding-resolver:5000;
    set $asset_svc    http://asset-model:5000;
    set $template_svc http://template-service:5000;
    set $analysis_svc http://analysis-service:5000;
    set $auth_svc     http://auth-service:3002;
    set $audit_svc    http://audit-service:8080;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ── Traverse services (HMI designer stack) ───────────────────────────
    location /api/displays {
        rewrite ^/api/displays(.*)$ /displays$1 break;
        proxy_pass $display_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/bindings/ {
        rewrite ^/api/bindings(.*)$ $1 break;
        proxy_pass $binding_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/assets {
        rewrite ^/api/assets(.*)$ /assets$1 break;
        proxy_pass $asset_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/templates {
        rewrite ^/api/templates(.*)$ /templates$1 break;
        proxy_pass $template_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/analyses {
        rewrite ^/api/analyses(.*)$ /analyses$1 break;
        proxy_pass $analysis_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        # Auth service serves /api/auth/* directly (no rewrite). Forward cookies.
        proxy_pass $auth_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/audit {
        rewrite ^/api/audit(.*)$ /api/v1/audit$1 break;
        proxy_pass $audit_svc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/hist/ {
        rewrite ^/api/hist/(.*)$ /$1 break;
        proxy_pass $hist_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass $ams_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /external-api/ {
        proxy_pass http://192.168.1.51:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass $ams_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── Phase 6: EMQX MQTT-over-WebSocket proxy ──────────────────────────
    # Frontend mqttStore connects to wss://<host>/mqtt-ws → nginx upgrades
    # and forwards to EMQX WS listener (plain ws inside Docker network).
    location /mqtt-ws {
        rewrite ^/mqtt-ws(.*)$ /mqtt$1 break;
        proxy_pass $emqx_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /health {
        proxy_pass $ams_api;
    }

    location /swagger {
        proxy_pass $ams_api;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
