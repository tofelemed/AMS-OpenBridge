<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Sets the theme before anything paints (CD4). Keep in step with src/theme/theme.ts. -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('ams-theme'); } catch (e) { /* storage unavailable */ }
        var theme = stored === 'night' || stored === 'dark' ? 'night' : 'day';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-obc-theme', theme);
        try { if (stored !== theme) localStorage.setItem('ams-theme', theme); } catch (e) { /* storage unavailable */ }
      })();
    </script>
    <meta charset="UTF-8" />
    <!-- Inline data-URI favicon: /vite.svg never existed (404 on every load) and
         an external file is one more asset to verify on an air-gapped plant. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23103a4d'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='18' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traverse CPA</title>
    <!-- Noto Sans / Noto Sans Mono are self-hosted (see src/styles/fonts.css).
         No Google Fonts CDN dependency — works on an air-gapped plant network. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
