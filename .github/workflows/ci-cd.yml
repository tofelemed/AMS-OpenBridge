# Build + verification only. Deployment is on-prem (Linux servers, operator-run),
# so there are no image-push or deploy jobs here — images are built and the stack
# is brought up on the target host via infra/docker.
name: AMS CI Pipeline

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_VERSION:   '8.0.x'
  NODE_VERSION:     '20.x'
  # Must match src/flink/pom.xml (maven.compiler.source/target = 11) AND the runtime image
  # (flink:1.18.1-java11). Building on 17 with -source/-target 11 still links against the
  # JDK 17 class library, which yields a jar that compiles clean and can throw
  # NoSuchMethodError on the Java 11 cluster. Used only by the build-flink job.
  JAVA_VERSION:     '11'

jobs:
  # ============================================================
  # Code Quality & Security
  # ============================================================
  lint-and-analyze:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: src/frontend-ob/package-lock.json }

      - name: .NET Restore
        run: dotnet restore src/backend/AMS.sln

      - name: .NET Format Check
        run: dotnet format src/backend/AMS.sln --verify-no-changes

      - name: Frontend Lint
        working-directory: src/frontend-ob
        run: |
          npm ci --prefer-offline
          npm run lint

      # RBAC catalog drift guard: fails if the permission catalog (manifest + SQL seed)
      # and the keys the .NET services actually enforce ever diverge.
      - name: Verify RBAC permission catalog
        run: node scripts/verify-permission-catalog.mjs

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: SAST - CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript, java

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v3

  # ============================================================
  # Backend Build & Test
  # ============================================================
  build-backend:
    name: Build & Test .NET Backend
    runs-on: ubuntu-latest
    needs: lint-and-analyze
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB:       ams_test
          POSTGRES_USER:     ams_test
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }

      - name: Restore
        run: dotnet restore src/backend/AMS.sln

      - name: Build (Release)
        run: dotnet build src/backend/AMS.sln -c Release --no-restore

      - name: Apply Database Migrations
        env:
          ConnectionStrings__AmsDb: Host=localhost;Port=5432;Database=ams_test;Username=ams_test;Password=test_password
        run: |
          dotnet tool install --global dotnet-ef
          cd src/backend/AMS.Api
          dotnet ef database update

      - name: Run Unit Tests
        run: |
          dotnet test src/backend/AMS.sln \
            -c Release \
            --no-build \
            --filter "Category=Unit" \
            --logger "trx;LogFileName=unit-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Run Integration Tests
        env:
          ConnectionStrings__AmsDb: Host=localhost;Port=5432;Database=ams_test;Username=ams_test;Password=test_password
        run: |
          dotnet test src/backend/AMS.sln \
            -c Release \
            --no-build \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./TestResults

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: TestResults/**/*.trx

      - name: Code Coverage
        uses: codecov/codecov-action@v4
        with:
          files: TestResults/**/coverage.cobertura.xml

      - name: Publish Artifact
        run: |
          dotnet publish src/backend/AMS.Api/AMS.Api.csproj \
            -c Release -o ./publish/api \
            /p:GenerateDocumentationFile=true

      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish/api
          retention-days: 5

  # ============================================================
  # Traverse Services Build
  # Nothing under src/services/ was compiled by CI before this — they are not in
  # AMS.sln, so a service could break on main and no job would notice. Added with
  # the CPLM extraction, which moved the loop-performance API into its own
  # service (src/services/cplm-api).
  # notification-service is deliberately absent: it does not compile today
  # (Serilog ReadFrom.Configuration needs Serilog.Settings.Configuration, which
  # its csproj lacks). Listing it would make this job permanently red; it needs a
  # real fix first, tracked separately from the extraction.
  # ============================================================
  build-services:
    name: Build Traverse Services
    runs-on: ubuntu-latest
    needs: lint-and-analyze
    strategy:
      fail-fast: false
      matrix:
        service:
          - asset-model
          - binding-resolver
          - display-service
          - template-service
          - analysis-service
          - historian-bff
          - audit-service
          - cplm-api
          # Added once it actually compiled (it was missing Serilog.Settings.Configuration)
          # and became a deployed service — it now consumes traverse.alarm.lifecycle-alerts (STR-05).
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }

      - name: Build ${{ matrix.service }}
        run: dotnet build src/services/${{ matrix.service }} -c Release

      # The shared RBAC module is copied into each service (each builds from its
      # own Docker context). A service whose copy has drifted from _shared would
      # ship different auth behaviour than the rest of the platform.
      - name: Verify TraverseAuth copy is in sync
        if: hashFiles(format('src/services/{0}/Auth/TraverseAuth.cs', matrix.service)) != ''
        run: diff -q src/services/_shared/TraverseAuth.cs src/services/${{ matrix.service }}/Auth/TraverseAuth.cs

  # ============================================================
  # Flink Build & Test
  # ============================================================
  build-flink:
    name: Build & Test Flink Jobs
    runs-on: ubuntu-latest
    needs: lint-and-analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '${{ env.JAVA_VERSION }}', distribution: temurin, cache: maven }

      - name: Build Flink Jobs
        working-directory: src/flink
        run: mvn clean package -DskipTests -Pproduction

      # Gate on the CPLM golden reference loop (SYN_TIC_001) explicitly and first. If the
      # gate math ever drifts, this must be the failure the log leads with — not something
      # buried in a full-suite run.
      - name: CPLM golden-loop regression (gate math must be unchanged)
        working-directory: src/flink
        run: mvn test -Dtest='Cplm*Test' -DfailIfNoTests=true

      - name: Run Flink Unit Tests
        working-directory: src/flink
        run: mvn test

      - uses: actions/upload-artifact@v4
        with:
          name: flink-jobs
          path: src/flink/target/*.jar
          retention-days: 5

  # ============================================================
  # Contract Gate — static + unit verification (every commit)
  # Full runtime verification: e2e-full-system-test.ps1 in lab/staging
  # ============================================================
  contract-gate:
    name: Contract Enforcement Gate
    runs-on: ubuntu-latest
    needs: lint-and-analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: src/frontend-ob/package-lock.json }

      - name: Run contract gate
        run: bash scripts/ci-contract-gate.sh

  # ============================================================
  # Frontend Build & Test
  # ============================================================
  build-frontend:
    name: Build & Test React Frontend
    runs-on: ubuntu-latest
    needs: lint-and-analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: src/frontend-ob/package-lock.json }

      - name: Install
        working-directory: src/frontend-ob
        run: npm ci --prefer-offline

      - name: Type Check
        working-directory: src/frontend-ob
        run: npx tsc --noEmit

      - name: Unit Tests
        working-directory: src/frontend-ob
        run: npm test -- --run --reporter=junit --outputFile=test-results.xml

      - name: Build
        working-directory: src/frontend-ob
        env:
          VITE_API_BASE_URL:     /api
          VITE_SIGNALR_HUB_URL: /hubs/alarms
          VITE_KEYCLOAK_REALM:  ams
          VITE_KEYCLOAK_CLIENT: ams-frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend-ob/dist
          retention-days: 5

