# Marun disk hardening (2026-09-03, disk-full round 2): ERROR-only, console-only.
# Mounted over /opt/flink/conf/log4j-console.properties by docker-compose.marun.yml
# (prod overlay only — the lab keeps the image's stock INFO config for debugging).
# The stock file also attaches a RollingFileAppender (100MB x 10 per process under
# /opt/flink/log); this one deliberately has no file appender at all, so the log
# dir stays empty and docker's json-log cap (10m x 3) bounds the console stream.
monitorInterval = 30

rootLogger.level = ERROR
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# Suppress the noisy netty pipeline error the stock config also silences.
logger.netty.name = org.jboss.netty.channel.DefaultChannelPipeline
logger.netty.level = OFF
