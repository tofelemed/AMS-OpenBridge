# Attached to every service as `logging: *default-logging` (Plan 08 item 5) —
# without it json-file logs grow unbounded and eventually fill the host disk.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

networks:
  ams-backend:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  cloudbeaver-data:
  kafka_0_data:
  zookeeper_data:
  zookeeper_log:
  # Retained for the file:// fallback; checkpoints now live in MinIO (STR-02).
  flink-checkpoints:
  # STR-02: durable Flink checkpoint/savepoint object store.
  minio-data:
  # â”€â”€ Phase 0: Edge platform historians & brokers â”€â”€
  iotdb-data:
  iotdb-logs:
  iotdb-ext:
  redis-data:
  redis-contract-data:
  emqx-data:
  emqx-log:
  # â”€â”€ Phase 6: Observability â”€â”€
  prometheus-data:
  grafana-data:
  # â”€â”€ Auth service RS256 signing key â”€â”€
  auth-keys:

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ams-postgres
    logging: *default-logging
    <<: *default-restart
    environment:
      POSTGRES_DB:       ams
      POSTGRES_USER:     ams_user
      # The :- default MUST stay identical to every consumer's default below. It previously
      # read "postgres" here while ams-api and both Flink services defaulted to
      # "supersecurepassword123", so a clone without infra/docker/.env (untracked) created the
      # database with one password and connected with another. Supply POSTGRES_PASSWORD via
      # .env for anything beyond a local lab.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set â€” see infra/docker/.env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams_user -d ams"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 0 â€” IoTDB historian (standalone, 1.3.2)
  # Session API :6667 | REST v2 :8181 | Metrics :9091
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  iotdb:
    image: apache/iotdb:1.3.2-standalone
    container_name: ams-iotdb
    logging: *default-logging
    <<: *default-restart
    environment:
      enable_auto_create_schema: "true"
      IOTDB_JMX_LOCAL: "true"
      # Enable REST API v2 (required by historian-bff / Flink IoTDB connector)
      enable_rest_service: "true"
      rest_service_port: "8181"
      # Prometheus metrics on :9091 (Plan 08 — the port was published but the
      # reporter was never enabled, so the scrape target was down forever)
      dn_metric_reporter_list: "PROMETHEUS"
      dn_metric_level: "CORE"
      dn_metric_prometheus_reporter_port: "9091"
    volumes:
      - iotdb-data:/iotdb/data
      - iotdb-logs:/iotdb/logs
      - iotdb-ext:/iotdb/ext
      # PIPE-014: explicit ON_HEAP/OFF_HEAP sizing. datanode-env.sh recalculates
      # from host memory unconditionally — env vars cannot override it, so the
      # edited script is mounted over the stock one.
      - ./iotdb/datanode-env.sh:/iotdb/conf/datanode-env.sh:ro
    ports:
      - "6667:6667"
      - "8181:8181"
      - "9091:9091"
    networks:
      - ams-backend
    healthcheck:
      # Session :6667 + REST :8181 (historian-bff queries REST v2)
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6667' 2>/dev/null && bash -c 'echo > /dev/tcp/localhost/8181' 2>/dev/null && exit 0 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 0 â€” Redis state-cache (7.2)
  # MQTT snapshot + alias registry :6379
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # CACHE tier (DATA-03): gateway rate-limit counters + response cache, service
  # invalidation pub/sub. Everything here is reconstructible — eviction is fine.
  # Snapshot/alias CONTRACT keys live on redis-contract below, NOT here.
  redis:
    image: redis:7.2-alpine
    container_name: ams-redis
    logging: *default-logging
    <<: *default-restart
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    volumes:
      - redis-data:/data
    # FINAL LOCKDOWN posture: no published host port (was 6380). In-network only.
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

  # CONTRACT tier (DATA-03): the paint-on-open snapshot keys (snapshot:*) and the
  # Sparkplug alias registry (alias:*). These are a CONTRACT, not a cache — a
  # faceplate opens blank if one is missing. noeviction: under memory pressure
  # writes fail loudly (edge node logs it) instead of Redis silently evicting a
  # live value. Sized for the real working set (~1 KB/snapshot x tags x devices);
  # alert at 80% used_memory (Plan 08 wires the exporter).
  redis-contract:
    image: redis:7.2-alpine
    container_name: ams-redis-contract
    logging: *default-logging
    <<: *default-restart
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    volumes:
      - redis-contract-data:/data
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 0 â€” EMQX MQTT broker (5.6, Sparkplug B)
  # TCP :1883 | WS :8083 | WSS :8084 | Dashboard :18083
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  emqx:
    image: emqx/emqx:5.6.0
    container_name: ams-emqx
    logging: *default-logging
    <<: *default-restart
    environment:
      EMQX_NAME: "ams-emqx"
      EMQX_HOST: "127.0.0.1"
      # Air-gap: OSS EMQX defaults telemetry.enable=true and posts to
      # telemetry.emqx.io after boot and every 7 days. Never on-plant.
      EMQX_TELEMETRY__ENABLE: "false"
      EMQX_MQTT__MAX_PACKET_SIZE: "1MB"
      # â”€â”€ Authentication (Plan 04 item 6, AUTH-03) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # Anonymous access is CLOSED. Authenticator chain (first success wins):
      #   1. JWT via auth-service JWKS â€” browsers present the platform RS256
      #      access token as the MQTT password. disconnect_after_expire=false:
      #      the 15-min token TTL must not drop live operator subscriptions
      #      every quarter hour; browsers are subscribe-only by ACL, and the
      #      frontend refreshes the token on every reconnect anyway.
      #   2. Built-in database â€” the Sparkplug edge node's ams_edge credential
      #      (created by emqx-init from EMQX_EDGE_PASSWORD).
      EMQX_AUTHENTICATION__1__MECHANISM: "jwt"
      EMQX_AUTHENTICATION__1__FROM: "password"
      EMQX_AUTHENTICATION__1__USE_JWKS: "true"
      EMQX_AUTHENTICATION__1__ENDPOINT: "http://auth-service:3002/api/auth/.well-known/jwks.json"
      EMQX_AUTHENTICATION__1__REFRESH_INTERVAL: "300"
      EMQX_AUTHENTICATION__1__DISCONNECT_AFTER_EXPIRE: "false"
      EMQX_AUTHENTICATION__2__MECHANISM: "password_based"
      EMQX_AUTHENTICATION__2__BACKEND: "built_in_database"
      # â”€â”€ Authorization: file ACL, deny-by-default â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # acl.conf: edge node owns spBv1.0/#; browsers subscribe-only; browser
      # publish (incl. NCMD/DCMD device commands) denied.
      EMQX_AUTHORIZATION__NO_MATCH: "deny"
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: "file"
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES__1__PATH: "/opt/emqx/etc/acl.conf"
      # â”€â”€ Listeners â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1883"
      EMQX_LISTENERS__WS__DEFAULT__BIND:  "0.0.0.0:8083"
      # â”€â”€ Logging â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      EMQX_LOG__CONSOLE__LEVEL: "warning"
      # â”€â”€ Dashboard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD must be set}
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
    ports:
      # 8084 (unused WSS listener) retired per Plan 04 item 6. 8083 direct WS
      # remains published for the transition; the frontend path is /mqtt-ws via
      # the gateway â€” see the final-lockdown note in the plan.
      - "1883:1883"
      # 8083 direct WS unpublished (FINAL LOCKDOWN) — browsers use /mqtt-ws via the gateway.
      - "18083:18083"
    networks:
      - ams-backend
    healthcheck:
      # NOT `emqx ctl status` / `emqx ping`: both attach an Erlang shell, which
      # takes 10-35s under load — the probe timed out forever while the broker
      # served fine, and every dependent service was blocked on "unhealthy".
      # A TCP accept on the MQTT listener answers in ~1s and tests what matters.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/1883 && exec 3<&-' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # One-shot: provision the Sparkplug edge node's MQTT credential in EMQX's
  # built-in-database authenticator (Plan 04 item 6). Idempotent; re-runs on
  # every stack start.
  emqx-init:
    image: curlimages/curl:8.9.1
    container_name: ams-emqx-init
    logging: *default-logging
    depends_on:
      emqx:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/emqx-init.sh"]
    environment:
      EMQX_API: http://emqx:18083/api/v5
      EMQX_DASHBOARD_USER:     ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD must be set}
      EMQX_EDGE_USER:          ${EMQX_EDGE_USER:-ams_edge}
      EMQX_EDGE_PASSWORD:      ${EMQX_EDGE_PASSWORD:?EMQX_EDGE_PASSWORD must be set}
    volumes:
      - ./emqx/emqx-init.sh:/emqx-init.sh:ro
    networks:
      - ams-backend
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ams-pgadmin
    logging: *default-logging
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - ams-backend

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # CloudBeaver CE + IoTDB driver (custom image)
  # Build:  docker compose build cloudbeaver
  #         # or:  .\infra\docker\cloudbeaver\build.ps1
  # UI: http://localhost:8978
  # IoTDB connection (from inside this container):
  #   host iotdb | port 6667 | user root | password root
  #   JDBC: jdbc:iotdb://iotdb:6667/  | dialect: Tree
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  cloudbeaver:
    build:
      context: ./cloudbeaver
      dockerfile: Dockerfile
      args:
        CLOUDBEAVER_TAG: "25.3.5"
        IOTDB_JDBC_VERSION: "1.3.2"
    image: ams-cloudbeaver:iotdb
    container_name: ams-cloudbeaver
    logging: *default-logging
    <<: *default-restart
    depends_on:
      iotdb:
        condition: service_healthy
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    ports:
      - "8978:8978"
    networks:
      - ams-backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: ams-zookeeper
    logging: *default-logging
    <<: *default-restart
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
      KAFKA_HEAP_OPTS:       "-Xmx128M -Xms128M"
    # The mounts MUST target the exact data/log dirs. The image declares its own
    # anonymous VOLUMEs there, so a parent-dir mount (the old zookeeper_data →
    # /var/lib/zookeeper) was silently shadowed: every `compose down && up`
    # abandoned ZK's real state, minting a fresh cluster ID while kafka's volume
    # kept the old one → InconsistentClusterIdException on the broker. This was
    # the root cause of the recurring "kafka needs a volume reset" lab failures.
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  kafka-ui:
      image: provectuslabs/kafka-ui:master
      container_name: kafka-ui
      ports:
        - "8085:8080"
      networks:
        - ams-backend
      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: ams-kafka
    logging: *default-logging
    hostname: kafka
    <<: *default-restart
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENERS:                        INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      # PIPE-001: EXTERNAL must advertise a host-resolvable address. The previous
      # `EXTERNAL://:9093` (empty host) made clients resolve the container's
      # canonical hostname, so every host-side producer/consumer failed after
      # bootstrap. 127.0.0.1 (not `localhost`): on Windows hosts `localhost`
      # resolves to ::1 first and Docker's published port black-holes IPv6.
      # Override KAFKA_EXTERNAL_HOST in .env for non-local access.
      KAFKA_ADVERTISED_LISTENERS:             INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-127.0.0.1}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # PIPE-005 / Plan 09: auto-create OFF — a typo'd topic name must fail loudly,
      # not materialize a 4-partition 24h-retention topic. Every required topic is
      # declared in scripts/kafka-reset-lab-topics.ps1 (incl. traverse.cpa.audit-events and
      # traverse.alarm.lifecycle-alerts since PIPE-006).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "false"
      KAFKA_NUM_PARTITIONS:                   4
      KAFKA_HEAP_OPTS:                        "-Xmx1024M -Xms1024M"
      KAFKA_LOG_RETENTION_HOURS:              "24"
      KAFKA_LOG_SEGMENT_BYTES:                "104857600"
    volumes:
      - kafka_0_data:/var/lib/kafka/data
    ports:
      - "9093:9093"
    networks:
      ams-backend:
        aliases:
          - kafka
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ────────────────────────────────────────────────
  # mock-dcs — lab stand-in for the DCS ACK endpoint (PIPE-002).
  # HttpAckWritebackService POSTs acknowledgements here and gets HTTP 200, so the
  # full ACK loop (traverse.alarm.operator-actions → traverse.alarm.ack-writeback → HTTP → traverse.alarm.ack-results
  # ACK_CONFIRMED → ACK_STATE_UPDATE → Postgres) is testable E2E without a real
  # DCS. Logs every ACK body to stdout for inspection. Remove/override
  # ACK_WRITEBACK_URL when a real feed host exists.
  # ────────────────────────────────────────────────
  mock-dcs:
    image: python:3.11-alpine
    container_name: ams-mock-dcs
    logging: *default-logging
    <<: *default-restart
    command:
      - python
      - -u
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class H(BaseHTTPRequestHandler):
            def do_POST(self):
                n = int(self.headers.get('Content-Length', 0))
                body = self.rfile.read(n)
                print('ACK', self.path, body.decode('utf-8', 'replace')[:400], flush=True)
                out = json.dumps({'status': 'ok'}).encode()
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(out)))
                self.end_headers()
                self.wfile.write(out)
            def log_message(self, *a):
                pass
        HTTPServer(('0.0.0.0', 8010), H).serve_forever()
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8010), 3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # MinIO â€” durable object storage for Flink checkpoints and savepoints (STR-02)
  #
  # Checkpoints previously lived on the `flink-checkpoints` local Docker volume, so
  # losing the host lost every exactly-once state: the ISA-18.2 alarm state machine,
  # the RBE fingerprints and the CPLM 24 h diagnostics buffer. This is storage
  # durability, NOT replication â€” a single MinIO node is enough here, and it is the
  # prerequisite that makes Flink JobManager HA (Plan 09) a config change rather
  # than a redesign, because HA needs a checkpoint store both JMs can reach.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: ams-minio
    logging: *default-logging
    <<: *default-restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-ams_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set â€” see infra/docker/.env.example}
      # Air-gap: default is an HTTPS update check against dl.min.io during
      # server bootstrap; offline it stalls readiness into the healthcheck.
      MINIO_UPDATE: "off"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot: create the checkpoint/savepoint buckets before Flink starts.
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: ams-minio-init
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-ams_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set â€” see infra/docker/.env.example}
      MC_UPDATE: "off"   # air-gap: no mc self-update probe
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/ams-flink &&
      mc mb --ignore-existing --with-lock local/ams-audit-archive-worm &&
      echo '[minio-init] buckets ready'
      "
    networks:
      - ams-backend
    restart: "no"

  flink-jobmanager:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-jobmanager
    logging: *default-logging
    <<: *default-restart
    entrypoint: ["/bin/bash", "/opt/flink-entrypoint.sh"]
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      # STR-02: the checkpoint buckets must exist before the first checkpoint fires.
      minio-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
        # JM HA (prod item 1, 2026-08-17): ZooKeeper-backed HA services. Even with a
        # single JM this persists submitted job graphs (ZK pointers + s3 blobs), so a
        # JobManager restart RECOVERS every job from its latest checkpoint instead of
        # wiping the registry and forcing fresh stateless resubmits (the 2026-08-13
        # failure mode: lost dedup/RBE/CPLM-24h state + traverse.alarm.raw-alarms replay storms).
        # MinIO (STR-02) was the prerequisite; ZK is the same ensemble Kafka uses.
        high-availability.type: zookeeper
        high-availability.zookeeper.quorum: zookeeper:2181
        high-availability.zookeeper.path.root: /flink-ams
        high-availability.cluster-id: /ams-lab
        high-availability.storageDir: s3://ams-flink/ha/
        # Phase 6: RocksDB state backend for large keyed state (RBE fingerprints)
        state.backend: rocksdb
        state.backend.incremental: true
        # STR-02 â€” durable object storage. Was file:///flink-checkpoints (a host-local
        # Docker volume): losing the host lost all exactly-once state. Savepoints get an
        # explicit home too, which STR-11's upgrade procedure depends on.
        state.checkpoints.dir: s3://ams-flink/checkpoints
        state.savepoints.dir: s3://ams-flink/savepoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER:-ams_minio}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set â€” see infra/docker/.env.example}
        # CPLM (Phase 2): cap retained checkpoints â€” RETAIN_ON_CANCELLATION plus the
        # CPLM jobs' 180-300 s intervals would otherwise grow the bucket unboundedly.
        state.checkpoints.num-retained: 3
        # Phase 6: checkpoint hardening â€” 60s interval, 30s min pause, EXACTLY_ONCE
        execution.checkpointing.interval: 60000
        execution.checkpointing.min-pause: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 120000
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        # Phase 6: Prometheus metrics reporter on :9249
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      # NB: do NOT set ENABLE_BUILT_IN_PLUGINS here. flink:1.18.1-java11 already ships
      # /opt/flink/plugins/metrics-prometheus/flink-metrics-prometheus-1.18.1.jar, and the jar
      # is NOT in /opt/flink/opt. The official entrypoint's copy_plugins_if_required() does
      # `exit 1` when the named plugin is missing from /opt/flink/opt, so setting the variable
      # kills both Flink containers on start. Verified: :9249 already serves metrics.
      # The s3-fs-presto plugin is installed by flink-entrypoint.sh for the same reason.
      KAFKA_BROKERS: kafka:9092
      DB_URL:        jdbc:postgresql://postgres:5432/ams
      DB_USER:       ams_user
      DB_PASS:       ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set â€” see infra/docker/.env.example}
      IOTDB_HOST:    iotdb
      IOTDB_PORT:    "6667"
      IOTDB_USER:    ${IOTDB_USER:-root}
      IOTDB_PASS:    ${IOTDB_PASSWORD:?IOTDB_PASSWORD must be set â€” change off the IoTDB default root/root}
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ./flink-entrypoint.sh:/opt/flink-entrypoint.sh:ro
    ports:
      - "8082:8081"
      - "9249:9249"
    networks:
      - ams-backend

  flink-taskmanager:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-taskmanager
    logging: *default-logging
    <<: *default-restart
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-entrypoint.sh"]
    command: taskmanager
    # No container resource limits: the TM hosts the CPLM long-diagnostics job, which
    # holds up to 24 h of samples per loop in keyed RocksDB state (~1 MB/loop at 5 s
    # sampling); actual usage is governed by taskmanager.memory.process.size below.
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 16
        # JM HA — must match the jobmanager exactly; the TM discovers the leading
        # JM through ZooKeeper once HA is on.
        high-availability.type: zookeeper
        high-availability.zookeeper.quorum: zookeeper:2181
        high-availability.zookeeper.path.root: /flink-ams
        high-availability.cluster-id: /ams-lab
        high-availability.storageDir: s3://ams-flink/ha/
        # Phase 6: consistent settings with jobmanager
        state.backend: rocksdb
        state.backend.incremental: true
        # STR-02 â€” must match the jobmanager exactly; the TM writes the actual
        # checkpoint data, so a TM still pointing at file:// would silently keep
        # state on the host while the JM believed it was durable.
        state.checkpoints.dir: s3://ams-flink/checkpoints
        state.savepoints.dir: s3://ams-flink/savepoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER:-ams_minio}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set â€” see infra/docker/.env.example}
        state.checkpoints.num-retained: 3
        execution.checkpointing.interval: 60000
        execution.checkpointing.min-pause: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 120000
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      # See the jobmanager block: ENABLE_BUILT_IN_PLUGINS must NOT be set on this image.
      KAFKA_BROKERS: kafka:9092
      DB_URL:        jdbc:postgresql://postgres:5432/ams
      DB_USER:       ams_user
      DB_PASS:       ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set â€” see infra/docker/.env.example}
      IOTDB_HOST:    iotdb
      IOTDB_PORT:    "6667"
      IOTDB_USER:    ${IOTDB_USER:-root}
      IOTDB_PASS:    ${IOTDB_PASSWORD:?IOTDB_PASSWORD must be set â€” change off the IoTDB default root/root}
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ./flink-entrypoint.sh:/opt/flink-entrypoint.sh:ro
    ports:
      # Prometheus scrapes this in-network; the host mapping is for manual inspection of
      # state size during the CPLM long-job sizing work.
      - "9250:9249"
    networks:
      - ams-backend

  flink-job-submit:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-job-submit
    logging: *default-logging
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-raw-alarms.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:       ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:       "8081"
      KAFKA_BROKERS:               kafka:9092
      # Phase J (audit-jobs.md finding 9): aligned with the supervisor and
      # ensure_flink_jobs.py — "earliest" here made every stack start replay the
      # whole raw-alarms topic through CAS/SignalR/historian.
      RAW_ALARMS_STARTING_OFFSETS: committed
      FLINK_JAR_PATH:              /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      FLINK_ENTRY_CLASS:           com.ams.flink.OpcEventStreamJob
    volumes:
      - ./flink-submit-raw-alarms.sh:/opt/flink-submit-raw-alarms.sh:ro
    networks:
      - ams-backend
    restart: "no"

  ams-api:
    build:
      context: ../../src/backend
      dockerfile: ../../infra/docker/api/Dockerfile
    container_name: ams-api
    logging: *default-logging
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT:   Development
      ASPNETCORE_URLS:          http://0.0.0.0:8000
      ASPNETCORE_HTTP_PORTS:    "8000"
      Urls:                     http://0.0.0.0:8000
      ConnectionStrings__AmsDb: Host=postgres;Port=5432;Database=ams;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set â€” see infra/docker/.env.example}
      # Edge-only auth (Plan 04): the gateway validates tokens; ams-api trusts its
      # X-Auth-* headers — no JWKS/issuer/audience config exists here anymore.
      Kafka__BootstrapServers:  kafka:9092
      Kafka__IngestAuthority:        api
      Kafka__ConsumerGroupId:        ams-backend-2
      Kafka__RawAlarmsTopic:         traverse.alarm.raw-alarms
      Flink__JobManagerUrl:          http://flink-jobmanager:8081
      AlarmIngestion__Enabled:       "true"
      AlarmIngestion__FeedUrl:          http://192.168.1.51:8010/api/current-alarms
      # PIPE-002: the real DCS host (192.168.1.51) is unreachable from this lab, so
      # every ACK ended ACK_FAILED and ACK_CONFIRMED was untestable E2E. The lab
      # now closes the loop against the mock-dcs stub below. Point back at the
      # real feed host (override in .env) when one exists.
      AlarmIngestion__AckWritebackUrl:  ${ACK_WRITEBACK_URL:-http://mock-dcs:8010/api/alarms/acknowledge}
      AlarmIngestion__PollIntervalMs: "2000"
      AlarmIngestion__ServerId:      "f0af9a6d-85f6-4c9f-a8ad-6de277d1d110"
      AlarmIngestion__ServerName:    "Current Alarms Feed"
      # CPLM Phase 4 â€” the loop registry reads the asset graph from asset-model to
      # CPLM extraction Phase 6: registry/recompute/consumers all live in
      # cplm-api now â€” its env block carries the Cpm__/CplmRecompute__ keys and
      # the Flink jar mount. ams-api keeps only RawLoopIotDbConsumer (IoTDB
      # historian writes, defaults suffice).
    # FINAL LOCKDOWN (Plan 04): no published port — reachable only through the gateway (8081) / compose network. See docs/api-gateway.md.
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]  # Plan 10 C1: liveness = critical checks only (postgres); pipeline state lives in /health + /health/pipeline
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s

  ams-frontend:
    build:
      context: ../../src/frontend-ob
      dockerfile: ../../infra/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_SIGNALR_HUB_URL: /hubs/alarms
        # Phase 5/6: MQTT + Historian BFF routes (nginx proxies /mqtt-ws and /api/hist)
        VITE_MQTT_WS_URL: /mqtt-ws
        VITE_SNAPSHOT_URL: /api/hist/snapshot
        VITE_HIST_URL: /api/hist
        VITE_SPARKPLUG_GROUP: ams_site1
        VITE_SPARKPLUG_EDGE: ams_edge1
    container_name: ams-frontend
    logging: *default-logging
    <<: *default-restart
    # Item 7 cutover: nginx serves the SPA and passes /api, /hubs, /mqtt-ws to
    # the gateway â€” its only upstream now.
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL:     http://ams-api:8000
      VITE_SIGNALR_HUB_URL: http://ams-api:8000/hubs/alarms
    ports:
      - "3000:80"
    networks:
      - ams-backend

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Plan 04 â€” API Gateway (YARP). SHADOW MODE: runs alongside nginx on 8080; the
  # frontend still talks to nginx (3000) until cutover flips it to the gateway
  # (then nginx serves the static SPA only â€” Plan 04 item 7). Edge-only auth:
  # validates RS256 tokens at the edge, enforces revocation within seconds, and
  # injects X-Auth-* identity headers (MIGRATION_LOG decision #16).
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  gateway:
    build:
      context: ../../src/services/gateway
    container_name: traverse-gateway
    logging: *default-logging
    <<: *default-restart
    depends_on:
      traverse-auth-service:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__JwksUrl:        http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__AuthServiceUrl: http://auth-service:3002
      Auth__Issuer:         traverse-auth
      Auth__Audience:       ams-services
      # Authenticates the edge-revocation poll against auth-service's internal endpoint.
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      Redis__Password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # TLS: set Gateway__Tls__CertPath (+ mount the cert) for HTTPS on 8443 in production.
      Gateway__ExposeSwagger: "false"
    ports:
      - "8081:8080"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /gw/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q Healthy <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 3 â€” Sparkplug B Edge Node
  # Kafka(traverse.alarm.live.alarms, traverse.live.metrics) â†’ EMQX â†’ HMI
  # Also writes Redis snapshot cache
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  sparkplug-edge-node:
    build:
      context: ../../src/services/sparkplug-edge-node
    # Explicit tag: without it the image name derives from the compose project
    # name, and an offline `up` without --no-build could hit Maven Central.
    image: ams-sparkplug-edge-node:1.0-SNAPSHOT
    container_name: ams-sparkplug-edge-node
    logging: *default-logging
    <<: *default-restart
    depends_on:
      kafka:
        condition: service_healthy
      emqx:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS:            kafka:9092
      LIVE_ALARMS_TOPIC:        traverse.alarm.live.alarms
      LIVE_METRICS_TOPIC:       traverse.live.metrics
      LIVE_LOOP_METRICS_TOPIC:  traverse.cpa.live.loop.metrics
      KAFKA_GROUP_ID:           traverse-sparkplug-edge
      # earliest = replay existing messages on startup (needed for E2E tests)
      KAFKA_AUTO_OFFSET_RESET:  earliest
      MQTT_HOST:                emqx
      MQTT_PORT:          "1883"
      MQTT_CLIENT_ID:     ams-edge-node-1
      MQTT_WS:            "false"
      # Phase 6: MQTT auth credentials (matches EMQX built-in auth user)
      MQTT_USERNAME:      ${EMQX_EDGE_USER:-ams_edge}
      MQTT_PASSWORD:      ${EMQX_EDGE_PASSWORD:?EMQX_EDGE_PASSWORD must be set}
      SPARKPLUG_GROUP:    ams_site1
      SPARKPLUG_EDGE:     ams_edge1
      # DATA-03: snapshots/aliases are CONTRACT data -> noeviction tier.
      REDIS_HOST:         redis-contract
      REDIS_PASSWORD:     ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_PORT:         "6379"
      REDIS_TTL_SECS:     "3600"
    networks:
      - ams-backend

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 4 â€” Historian BFF (.NET 8 Minimal API)
  # /trend, /raw â†’ IoTDB REST v2
  # /snapshot    â†’ Redis
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  historian-bff:
    build:
      context: ../../src/services/historian-bff
    container_name: ams-historian-bff
    logging: *default-logging
    <<: *default-restart
    depends_on:
      iotdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8090
      IoTDB__RestUrl:  http://iotdb:8181
      Redis__Host:     redis-contract   # DATA-03: contract tier (snapshots)
      Redis__Password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      Redis__Port:     "6379"
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Sends the key to asset-model but receives no internal calls itself â†’ principal can do nothing.
      Auth__ServicePermissions: ""
    # FINAL LOCKDOWN (Plan 04): no published port — reachable only through the gateway (8081) / compose network. See docs/api-gateway.md.
    networks:
      - ams-backend
    healthcheck:
      # P3-10 - probe /health (which checks IoTDB + Redis), not bare TCP: the
      # container used to report healthy with the historian down. The image
      # installs wget for exactly this purpose (aspnet slim has no curl).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 1 â€” Asset Model Service (UNS source of truth)
  # REST API for asset hierarchy and UNS path resolution
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  asset-model:
    build:
      context: ../../src/services/asset-model
    container_name: traverse-asset-model
    logging: *default-logging
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseAssets: Host=postgres;Port=5432;Database=traverse_assets;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set â€” see infra/docker/.env.example}
      Redis__Host:     redis
      Redis__Password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      Redis__Port:     "6379"
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Service-principal scope (AUTH-01): asset-model is the ONLY service that receives internal
      # X-Service-Key calls â€” reads from binding-resolver/cplm-api (asset.view) and derived-asset
      # registration from analysis-service (asset.edit). Nothing else is granted.
      Auth__ServicePermissions: "asset.view,asset.edit"
      # Cross-DB delete guard (G-02): before deleting a hierarchy node, ask
      # cplm-api how many loops still reference it. Set -> fail closed when the
      # probe cannot answer; unset -> guard skipped (single-container dev).
      Services__CplmApi: http://cplm-api:5000
    # FINAL LOCKDOWN (Plan 04): no published port — reachable only through the gateway (8081) / compose network. See docs/api-gateway.md.
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]  # aspnet image has no wget/curl; /dev/tcp works
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Test MQTT broker for the ingestion feature (opt-in: --profile mqtt-test).
  # Authenticated (no anonymous) so connection tests exercise real credentials.
  # In-network address: mqtt://mosquitto-test:1883 ; host address for manual
  # tools: mqtt://localhost:1884 (1884 avoids clashing with a host Mosquitto).
  mosquitto-test:
    image: eclipse-mosquitto:2
    container_name: ams-mosquitto-test
    profiles: ["mqtt-test"]
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    # mosquitto drops to the 'mosquitto' user when started as root — the passwd
    # file must be owned by it or startup fails with "Unable to open pwfile".
    command:
      - >-
        rm -f /mosquitto/config/passwd;
        mosquitto_passwd -b -c /mosquitto/config/passwd
        ${MOSQUITTO_TEST_USER:-ams_ingest} ${MOSQUITTO_TEST_PASSWORD:-ams-ingest-test};
        chown mosquitto:mosquitto /mosquitto/config/passwd;
        chmod 0600 /mosquitto/config/passwd;
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto-test/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1884:1883"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u ${MOSQUITTO_TEST_USER:-ams_ingest} -P ${MOSQUITTO_TEST_PASSWORD:-ams-ingest-test} -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Ingestion Service (OT data-source configuration): MQTT broker connection
  # configs + encrypted credential store + one-shot connection test. The phase-2
  # MQTT subscriber pipeline lands in this same service (decrypted credentials
  # never cross the network).
  # Service KEY is traverse-ingestion-service for the same reason as
  # traverse-auth-service below: Instrumental's shared plant network already
  # owns the DNS name `ingestion-service` (their MQTT ingest, a different
  # product). Internal callers keep using `ingestion-service` via the alias.
  traverse-ingestion-service:
    build:
      context: ../../src/services/ingestion-service
    container_name: traverse-ingestion-service
    logging: *default-logging
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseIngestion: Host=postgres;Port=5432;Database=traverse_ingestion;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Master secret for AES-256-GCM credential encryption (>= 32 chars).
      # Rotating it orphans every stored broker password - operators re-enter them.
      ENCRYPTION_KEY: ${INGESTION_ENCRYPTION_KEY:?INGESTION_ENCRYPTION_KEY must be set (>= 32 chars, generate with openssl rand -hex 24)}
      # traverse.cpa.audit-events producer + phase-2 loop-sample/DLQ producer (empty disables)
      Kafka__BootstrapServers: kafka:9092
      # Override in .env for labs whose Kafka volume still carries the legacy
      # un-prefixed topic generation (e.g. INGESTION_LOOP_SAMPLES_TOPIC=loop.samples.v1).
      Kafka__LoopSamplesTopic: ${INGESTION_LOOP_SAMPLES_TOPIC:-traverse.cpa.loop.samples.v1}
      Kafka__OtDlqTopic: traverse.ingestion.ot-dlq
      # Phase-2 subscriber pulls the CPM Loop Registry (cplm-api grants internal
      # X-Service-Key callers analytics.view - see cplm-api's Auth__ServicePermissions).
      Services__CplmApi: http://cplm-api:5000
      # Platform auth (edge-only): authorize from gateway-injected X-Auth-* headers.
      # SENDS X-Service-Key to cplm-api (registry sync) but receives no internal
      # calls itself - service principal scope stays empty.
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      Auth__ServicePermissions: ""
    # No published port - reachable only through the gateway (8081) / compose network.
    networks:
      ams-backend:
        aliases: [ingestion-service]   # internal DNS name; never leaks onto shared networks
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]  # aspnet image has no wget/curl; /dev/tcp works
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Auth Service (Node/Express)
  # Login, RS256 JWTs (JWKS at /api/auth/.well-known/jwks.json), RBAC
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Service KEY is traverse-auth-service (not auth-service): Compose registers
  # the service name as DNS on EVERY attached network — container_name/aliases
  # do not replace it (measured 2026-08-30). Instrumental's shared plant network
  # already owns `auth-service`, so a colliding key would round-robin THEIR
  # lookups into our container. The `auth-service` DNS name every JWKS/auth URL
  # uses lives on as an alias scoped to ams-backend below.
  traverse-auth-service:
    build:
      context: ../../src/services/auth-service
    container_name: traverse-auth-service
    logging: *default-logging
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3002"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: traverse_auth
      DB_USER: ams_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set â€” see infra/docker/.env.example}
      # RBAC governance audit trail (Phase 3): role/permission/user changes are emitted
      # to traverse.cpa.audit-events for the tamper-evident store. Unset â†’ emit is a no-op (dev).
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Stable RS256 key persisted in the auth-keys volume (generated on first start).
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_ISSUER: traverse-auth
      JWT_AUDIENCE: ams-services
      # 1h access tokens (decision 2026-08-12): safe because the gateway enforces
      # revocation within 5s; quarters the /refresh traffic vs the old 15m.
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      # Dual-clock session policy (enforced only on /auth/refresh, DB clock):
      # sliding idle + absolute max. Operators watch (SignalR) more than they
      # click, so their idle window is longer; the absolute cap binds everyone.
      SESSION_IDLE_TIMEOUT: 30m
      SESSION_ABSOLUTE_TIMEOUT: 12h
      SESSION_IDLE_TIMEOUT_OPERATOR: 8h
      # Served over HTTP inside the lab stack, so the refresh cookie cannot be Secure.
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      # 100/15min (the default) is per-IP: a control room behind one NAT â€” or an automated gate run â€”
      # exhausts it in minutes. Lab value; tune per deployment.
      RATE_LIMIT_MAX_REQUESTS: "2000"
      CORS_ORIGIN: http://localhost:3000,http://localhost:5174
      # Entrypoint seeds this admin once (idempotent).
      BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-admin@local}
      BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:?AUTH_BOOTSTRAP_PASSWORD must be set â€” the first-run admin password}
      # Guards GET /api/auth/internal/revocations â€” the gateway's edge-revocation poll
      # (Plan 04 Â§2). Unset â†’ the internal endpoint is disabled.
      TRAVERSE_SERVICE_KEY: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
    volumes:
      - auth-keys:/app/keys
    # FINAL LOCKDOWN (Plan 04): no published port — reachable only through the gateway (8081) / compose network. See docs/api-gateway.md.
    networks:
      ams-backend:
        aliases: [auth-service]   # internal DNS name; never leaks onto shared networks
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

