x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

networks:
  ams-backend:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  cloudbeaver-data:
  kafka_0_data:
  zookeeper_data:
  # Retained for the file:// fallback; checkpoints now live in MinIO (STR-02).
  flink-checkpoints:
  # STR-02: durable Flink checkpoint/savepoint object store.
  minio-data:
  # ── Phase 0: Edge platform historians & brokers ──
  iotdb-data:
  iotdb-logs:
  iotdb-ext:
  iotdb-workbench-data:
  redis-data:
  emqx-data:
  emqx-log:
  # ── Phase 6: Observability ──
  prometheus-data:
  grafana-data:
  # ── Auth service RS256 signing key ──
  auth-keys:

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ams-postgres
    <<: *default-restart
    environment:
      POSTGRES_DB:       ams
      POSTGRES_USER:     ams_user
      # The :- default MUST stay identical to every consumer's default below. It previously
      # read "postgres" here while ams-api and both Flink services defaulted to
      # "supersecurepassword123", so a clone without infra/docker/.env (untracked) created the
      # database with one password and connected with another. Supply POSTGRES_PASSWORD via
      # .env for anything beyond a local lab.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams_user -d ams"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  # ─────────────────────────────────────────────
  # Phase 0 — IoTDB historian (standalone, 1.3.2)
  # Session API :6667 | REST v2 :8181 | Metrics :9091
  # ─────────────────────────────────────────────
  iotdb:
    image: apache/iotdb:1.3.2-standalone
    container_name: ams-iotdb
    <<: *default-restart
    environment:
      enable_auto_create_schema: "true"
      IOTDB_JMX_LOCAL: "true"
      # Enable REST API v2 (required by historian-bff / Flink IoTDB connector)
      enable_rest_service: "true"
      rest_service_port: "8181"
    volumes:
      - iotdb-data:/iotdb/data
      - iotdb-logs:/iotdb/logs
      - iotdb-ext:/iotdb/ext
    ports:
      - "6667:6667"
      - "8181:8181"
      - "9091:9091"
    networks:
      - ams-backend
    healthcheck:
      # Session :6667 + REST :8181 (historian-bff queries REST v2)
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6667' 2>/dev/null && bash -c 'echo > /dev/tcp/localhost/8181' 2>/dev/null && exit 0 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ─────────────────────────────────────────────
  # Phase 0 — Redis state-cache (7.2)
  # MQTT snapshot + alias registry :6379
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ams-redis
    <<: *default-restart
    # Phase 6.7 — snapshots are a paint-on-open CONTRACT, not a cache.
    # allkeys-lru let Redis evict a live snapshot under memory pressure, so a
    # faceplate could open blank with nothing logged and nothing to retry
    # against. volatile-lru only evicts keys carrying an explicit TTL, which is
    # exactly the edge node's snapshot expiry and nothing else.
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"    # host:6380 → container:6379 (6379 taken by Docker backend)
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Phase 0 — EMQX MQTT broker (5.6, Sparkplug B)
  # TCP :1883 | WS :8083 | WSS :8084 | Dashboard :18083
  # ─────────────────────────────────────────────
  emqx:
    image: emqx/emqx:5.6.0
    container_name: ams-emqx
    <<: *default-restart
    environment:
      EMQX_NAME: "ams-emqx"
      EMQX_HOST: "127.0.0.1"
      # ── Auth ──────────────────────────────────────────────────────────────
      # EMQX 5.x: anonymous access is controlled via the 'allow_anonymous'
      # key inside the built-in auth chain, NOT EMQX_ALLOW_ANONYMOUS.
      # Setting it to true lets the E2E test client (no creds) connect for
      # DDATA subscription without provisioning a separate user.
      # The sparkplug-edge-node still sends MQTT_USERNAME/PASSWORD which EMQX
      # accepts even with anonymous=true (credentials are validated if provided).
      EMQX_MQTT__MAX_PACKET_SIZE: "1MB"
      # EMQX 5.x anonymous auth — allow unauthenticated connections
      EMQX_ALLOW_ANONYMOUS: "true"
      # ── Listeners ─────────────────────────────────────────────────────────
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1883"
      EMQX_LISTENERS__WS__DEFAULT__BIND:  "0.0.0.0:8083"
      # ── Logging ───────────────────────────────────────────────────────────
      EMQX_LOG__CONSOLE__LEVEL: "warning"
      # ── Dashboard ─────────────────────────────────────────────────────────
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD must be set}
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ams-pgadmin
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - ams-backend

  # ─────────────────────────────────────────────
  # CloudBeaver CE + IoTDB driver (custom image)
  # Build:  docker compose build cloudbeaver
  #         # or:  .\infra\docker\cloudbeaver\build.ps1
  # UI: http://localhost:8978
  # IoTDB connection (from inside this container):
  #   host iotdb | port 6667 | user root | password root
  #   JDBC: jdbc:iotdb://iotdb:6667/  | dialect: Tree
  # ─────────────────────────────────────────────
  cloudbeaver:
    build:
      context: ./cloudbeaver
      dockerfile: Dockerfile
      args:
        CLOUDBEAVER_TAG: "25.3.5"
        IOTDB_JDBC_VERSION: "1.3.2"
    image: ams-cloudbeaver:iotdb
    container_name: ams-cloudbeaver
    <<: *default-restart
    depends_on:
      iotdb:
        condition: service_healthy
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    ports:
      - "8978:8978"
    networks:
      - ams-backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: ams-zookeeper
    <<: *default-restart
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
      KAFKA_HEAP_OPTS:       "-Xmx128M -Xms128M"
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  kafka-ui:
      image: provectuslabs/kafka-ui:master
      container_name: kafka-ui
      ports:
        - "8085:8080"
      networks:
        - ams-backend
      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092,kafka-1:9093,kafka-2:9094
        KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: ams-kafka
    hostname: kafka
    <<: *default-restart
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENERS:                        INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:             INTERNAL://kafka:9092,EXTERNAL://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_NUM_PARTITIONS:                   4
      KAFKA_HEAP_OPTS:                        "-Xmx1024M -Xms1024M"
      KAFKA_LOG_RETENTION_HOURS:              "24"
      KAFKA_LOG_SEGMENT_BYTES:                "104857600"
    volumes:
      - kafka_0_data:/var/lib/kafka/data
    ports:
      - "9093:9093"
    networks:
      ams-backend:
        aliases:
          - kafka
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ─────────────────────────────────────────────
  # MinIO — durable object storage for Flink checkpoints and savepoints (STR-02)
  #
  # Checkpoints previously lived on the `flink-checkpoints` local Docker volume, so
  # losing the host lost every exactly-once state: the ISA-18.2 alarm state machine,
  # the RBE fingerprints and the CPLM 24 h diagnostics buffer. This is storage
  # durability, NOT replication — a single MinIO node is enough here, and it is the
  # prerequisite that makes Flink JobManager HA (Plan 09) a config change rather
  # than a redesign, because HA needs a checkpoint store both JMs can reach.
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: ams-minio
    <<: *default-restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-ams_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set — see infra/docker/.env.example}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot: create the checkpoint/savepoint buckets before Flink starts.
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: ams-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-ams_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set — see infra/docker/.env.example}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/ams-flink &&
      echo '[minio-init] buckets ready'
      "
    networks:
      - ams-backend
    restart: "no"

  flink-jobmanager:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-jobmanager
    <<: *default-restart
    entrypoint: ["/bin/bash", "/opt/flink-entrypoint.sh"]
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      # STR-02: the checkpoint buckets must exist before the first checkpoint fires.
      minio-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
        # Phase 6: RocksDB state backend for large keyed state (RBE fingerprints)
        state.backend: rocksdb
        state.backend.incremental: true
        # STR-02 — durable object storage. Was file:///flink-checkpoints (a host-local
        # Docker volume): losing the host lost all exactly-once state. Savepoints get an
        # explicit home too, which STR-11's upgrade procedure depends on.
        state.checkpoints.dir: s3://ams-flink/checkpoints
        state.savepoints.dir: s3://ams-flink/savepoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER:-ams_minio}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set — see infra/docker/.env.example}
        # CPLM (Phase 2): cap retained checkpoints — RETAIN_ON_CANCELLATION plus the
        # CPLM jobs' 180-300 s intervals would otherwise grow the bucket unboundedly.
        state.checkpoints.num-retained: 3
        # Phase 6: checkpoint hardening — 60s interval, 30s min pause, EXACTLY_ONCE
        execution.checkpointing.interval: 60000
        execution.checkpointing.min-pause: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 120000
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        # Phase 6: Prometheus metrics reporter on :9249
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      # NB: do NOT set ENABLE_BUILT_IN_PLUGINS here. flink:1.18.1-java11 already ships
      # /opt/flink/plugins/metrics-prometheus/flink-metrics-prometheus-1.18.1.jar, and the jar
      # is NOT in /opt/flink/opt. The official entrypoint's copy_plugins_if_required() does
      # `exit 1` when the named plugin is missing from /opt/flink/opt, so setting the variable
      # kills both Flink containers on start. Verified: :9249 already serves metrics.
      # The s3-fs-presto plugin is installed by flink-entrypoint.sh for the same reason.
      KAFKA_BROKERS: kafka:9092
      DB_URL:        jdbc:postgresql://postgres:5432/ams
      DB_USER:       ams_user
      DB_PASS:       ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      IOTDB_HOST:    iotdb
      IOTDB_PORT:    "6667"
      IOTDB_USER:    ${IOTDB_USER:-root}
      IOTDB_PASS:    ${IOTDB_PASSWORD:?IOTDB_PASSWORD must be set — change off the IoTDB default root/root}
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ./flink-entrypoint.sh:/opt/flink-entrypoint.sh:ro
    ports:
      - "8082:8081"
      - "9249:9249"
    networks:
      - ams-backend

  flink-taskmanager:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-taskmanager
    <<: *default-restart
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-entrypoint.sh"]
    command: taskmanager
    # No container resource limits: the TM hosts the CPLM long-diagnostics job, which
    # holds up to 24 h of samples per loop in keyed RocksDB state (~1 MB/loop at 5 s
    # sampling); actual usage is governed by taskmanager.memory.process.size below.
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 16
        # Phase 6: consistent settings with jobmanager
        state.backend: rocksdb
        state.backend.incremental: true
        # STR-02 — must match the jobmanager exactly; the TM writes the actual
        # checkpoint data, so a TM still pointing at file:// would silently keep
        # state on the host while the JM believed it was durable.
        state.checkpoints.dir: s3://ams-flink/checkpoints
        state.savepoints.dir: s3://ams-flink/savepoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER:-ams_minio}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set — see infra/docker/.env.example}
        state.checkpoints.num-retained: 3
        execution.checkpointing.interval: 60000
        execution.checkpointing.min-pause: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 120000
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      # See the jobmanager block: ENABLE_BUILT_IN_PLUGINS must NOT be set on this image.
      KAFKA_BROKERS: kafka:9092
      DB_URL:        jdbc:postgresql://postgres:5432/ams
      DB_USER:       ams_user
      DB_PASS:       ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      IOTDB_HOST:    iotdb
      IOTDB_PORT:    "6667"
      IOTDB_USER:    ${IOTDB_USER:-root}
      IOTDB_PASS:    ${IOTDB_PASSWORD:?IOTDB_PASSWORD must be set — change off the IoTDB default root/root}
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ./flink-entrypoint.sh:/opt/flink-entrypoint.sh:ro
    ports:
      # Prometheus scrapes this in-network; the host mapping is for manual inspection of
      # state size during the CPLM long-job sizing work.
      - "9250:9249"
    networks:
      - ams-backend

  flink-job-submit:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-job-submit
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-raw-alarms.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:       ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:       "8081"
      KAFKA_BROKERS:               kafka:9092
      RAW_ALARMS_STARTING_OFFSETS: earliest
      FLINK_JAR_PATH:              /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      FLINK_ENTRY_CLASS:           com.ams.flink.OpcEventStreamJob
    volumes:
      - ./flink-submit-raw-alarms.sh:/opt/flink-submit-raw-alarms.sh:ro
    networks:
      - ams-backend
    restart: "no"

  ams-api:
    build:
      context: ../../src/backend
      dockerfile: ../../infra/docker/api/Dockerfile
    container_name: ams-api
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT:   Development
      ASPNETCORE_URLS:          http://0.0.0.0:8000
      ASPNETCORE_HTTP_PORTS:    "8000"
      Urls:                     http://0.0.0.0:8000
      ConnectionStrings__AmsDb: Host=postgres;Port=5432;Database=ams;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      # Phase K — RBAC: real bearer auth (replaces the TestAuthHandler bypass).
      Auth__JwksUrl:            http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:             traverse-auth
      Auth__Audience:           ams-services
      Kafka__BootstrapServers:  kafka:9092
      Kafka__IngestAuthority:        api
      Kafka__ConsumerGroupId:        ams-backend-2
      Kafka__RawAlarmsTopic:         raw-alarms
      Flink__JobManagerUrl:          http://flink-jobmanager:8081
      AlarmIngestion__Enabled:       "true"
      AlarmIngestion__FeedUrl:          http://192.168.1.51:8010/api/current-alarms
      AlarmIngestion__AckWritebackUrl:  http://192.168.1.51:8010/api/alarms/acknowledge
      AlarmIngestion__PollIntervalMs: "2000"
      AlarmIngestion__ServerId:      "f0af9a6d-85f6-4c9f-a8ad-6de277d1d110"
      AlarmIngestion__ServerName:    "Current Alarms Feed"
      # CPLM Phase 4 — the loop registry reads the asset graph from asset-model to
      # CPLM extraction Phase 6: registry/recompute/consumers all live in
      # cplm-api now — its env block carries the Cpm__/CplmRecompute__ keys and
      # the Flink jar mount. ams-api keeps only RawLoopIotDbConsumer (IoTDB
      # historian writes, defaults suffice).
    ports:
      - "8000:8000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s

  ams-frontend:
    build:
      context: ../../src/frontend-ob
      dockerfile: ../../infra/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_SIGNALR_HUB_URL: /hubs/alarms
        # Phase 5/6: MQTT + Historian BFF routes (nginx proxies /mqtt-ws and /api/hist)
        VITE_MQTT_WS_URL: /mqtt-ws
        VITE_SNAPSHOT_URL: /api/hist/snapshot
        VITE_HIST_URL: /api/hist
        VITE_SPARKPLUG_GROUP: ams_site1
        VITE_SPARKPLUG_EDGE: ams_edge1
    container_name: ams-frontend
    <<: *default-restart
    depends_on:
      ams-api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL:     http://ams-api:8000
      VITE_SIGNALR_HUB_URL: http://ams-api:8000/hubs/alarms
    ports:
      - "3000:80"
    networks:
      - ams-backend

  # ─────────────────────────────────────────────
  # Phase 3 — Sparkplug B Edge Node
  # Kafka(live.alarms, live.metrics) → EMQX → HMI
  # Also writes Redis snapshot cache
  # ─────────────────────────────────────────────
  sparkplug-edge-node:
    build:
      context: ../../src/services/sparkplug-edge-node
    container_name: ams-sparkplug-edge-node
    <<: *default-restart
    depends_on:
      kafka:
        condition: service_healthy
      emqx:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS:            kafka:9092
      LIVE_ALARMS_TOPIC:        live.alarms
      LIVE_METRICS_TOPIC:       live.metrics
      KAFKA_GROUP_ID:           ams-sparkplug-edge-node
      # earliest = replay existing messages on startup (needed for E2E tests)
      KAFKA_AUTO_OFFSET_RESET:  earliest
      MQTT_HOST:                emqx
      MQTT_PORT:          "1883"
      MQTT_CLIENT_ID:     ams-edge-node-1
      MQTT_WS:            "false"
      # Phase 6: MQTT auth credentials (matches EMQX built-in auth user)
      MQTT_USERNAME:      ${EMQX_EDGE_USER:-ams_edge}
      MQTT_PASSWORD:      ${EMQX_EDGE_PASSWORD:?EMQX_EDGE_PASSWORD must be set}
      SPARKPLUG_GROUP:    ams_site1
      SPARKPLUG_EDGE:     ams_edge1
      REDIS_HOST:         redis
      REDIS_PORT:         "6379"
      REDIS_TTL_SECS:     "3600"
    networks:
      - ams-backend

  # ─────────────────────────────────────────────
  # Phase 4 — Historian BFF (.NET 8 Minimal API)
  # /trend, /raw → IoTDB REST v2
  # /snapshot    → Redis
  # ─────────────────────────────────────────────
  historian-bff:
    build:
      context: ../../src/services/historian-bff
    container_name: ams-historian-bff
    <<: *default-restart
    depends_on:
      iotdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8090
      IoTDB__RestUrl:  http://iotdb:8181
      Redis__Host:     redis
      Redis__Port:     "6379"
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Sends the key to asset-model but receives no internal calls itself → principal can do nothing.
      Auth__ServicePermissions: ""
    ports:
      - "8090:8090"
    networks:
      - ams-backend
    healthcheck:
      # P3-10 - probe /health (which checks IoTDB + Redis), not bare TCP: the
      # container used to report healthy with the historian down. The image
      # installs wget for exactly this purpose (aspnet slim has no curl).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 1 — Asset Model Service (UNS source of truth)
  # REST API for asset hierarchy and UNS path resolution
  # ─────────────────────────────────────────────
  asset-model:
    build:
      context: ../../src/services/asset-model
    container_name: traverse-asset-model
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseAssets: Host=postgres;Port=5432;Database=traverse_assets;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      Redis__Host:     redis
      Redis__Port:     "6379"
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Service-principal scope (AUTH-01): asset-model is the ONLY service that receives internal
      # X-Service-Key calls — reads from binding-resolver/cplm-api (asset.view) and derived-asset
      # registration from analysis-service (asset.edit). Nothing else is granted.
      Auth__ServicePermissions: "asset.view,asset.edit"
    ports:
      - "5001:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]  # aspnet image has no wget/curl; /dev/tcp works
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Auth Service (Node/Express)
  # Login, RS256 JWTs (JWKS at /api/auth/.well-known/jwks.json), RBAC
  # ─────────────────────────────────────────────
  auth-service:
    build:
      context: ../../src/services/auth-service
    container_name: traverse-auth-service
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3002"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: traverse_auth
      DB_USER: ams_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      # RBAC governance audit trail (Phase 3): role/permission/user changes are emitted
      # to audit-events for the tamper-evident store. Unset → emit is a no-op (dev).
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Stable RS256 key persisted in the auth-keys volume (generated on first start).
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_ISSUER: traverse-auth
      JWT_AUDIENCE: ams-services
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      # Served over HTTP inside the lab stack, so the refresh cookie cannot be Secure.
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      # 100/15min (the default) is per-IP: a control room behind one NAT — or an automated gate run —
      # exhausts it in minutes. Lab value; tune per deployment.
      RATE_LIMIT_MAX_REQUESTS: "2000"
      CORS_ORIGIN: http://localhost:3000,http://localhost:5174
      # Entrypoint seeds this admin once (idempotent).
      BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-admin@local}
      BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:?AUTH_BOOTSTRAP_PASSWORD must be set — the first-run admin password}
    volumes:
      - auth-keys:/app/keys
    ports:
      - "3002:3002"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 1 — Binding Resolver BFF
  # Resolves UNS path + role → transport (live/history/alarm)
  # ─────────────────────────────────────────────
  binding-resolver:
    build:
      context: ../../src/services/binding-resolver
    container_name: traverse-binding-resolver
    <<: *default-restart
    depends_on:
      redis:
        condition: service_healthy
      asset-model:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      Redis__Host:         redis
      Redis__Port:         "6379"
      Mqtt__Host:          emqx
      Mqtt__WebSocketPort: "8083"
      Mqtt__Protocol:      ws
      Services__AssetModel:    http://asset-model:5000
      Services__HistorianBff:  http://historian-bff:8090
      Services__AmsApi:        http://ams-api:8000
      Services__SignalRHub:    http://ams-api:8000/hubs/alarms
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Sends the key to asset-model but receives no internal calls itself → principal can do nothing.
      Auth__ServicePermissions: ""
    ports:
      - "5002:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]  # aspnet image has no wget/curl; /dev/tcp works
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 2 — Display Service
  # CRUD for HMI display definitions (versioned, no process values)
  # ─────────────────────────────────────────────
  display-service:
    build:
      context: ../../src/services/display-service
    container_name: traverse-display-service
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseDisplays: Host=postgres;Port=5432;Database=traverse_displays;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      Redis__Host:     redis
      Redis__Port:     "6379"
      # Phase 5 — emit governance audit events to the audit-service via Kafka.
      Kafka__BootstrapServers: kafka:9092
      # Phase K — RBAC: validate RS256 tokens from auth-service (JWKS; no OIDC discovery).
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
    ports:
      - "5003:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]  # aspnet image has no wget/curl; /dev/tcp works
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 5 (V2) — Audit Service
  # Consumes audit-events (governance actions emitted by display-service) into an immutable, hash-chained
  # store and exposes GET /api/v1/audit. Without this the audit trail has a producer but no consumer.
  # ─────────────────────────────────────────────
  audit-service:
    build:
      context: ../../src/services/audit-service
    container_name: traverse-audit-service
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__AuditDb: Host=postgres;Port=5432;Database=traverse_audit;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      Kafka__BootstrapServers: kafka:9092
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
    ports:
      - "8095:8080"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]  # aspnet image has no wget/curl
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Notification Service — root-cause + platform lifecycle alerts
  #
  # STR-05: this service existed in the tree but was never deployed, which left
  # the `lifecycle-alerts` topic with two producers (the telemetry deadman and the
  # ACK-SLA watchdog in ams-api) and NO consumer — a dead OPC feed raised nothing
  # an operator could see. It also never compiled until Serilog.Settings.Configuration
  # was added, which is why CI excluded it from the build matrix.
  # ─────────────────────────────────────────────
  notification-service:
    build:
      context: ../../src/services/notification-service
    container_name: traverse-notification-service
    <<: *default-restart
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Kafka__BootstrapServers: kafka:9092
      Kafka__LifecycleAlertsTopic: lifecycle-alerts
      # Platform auth (AUTH-07): validate RS256 tokens from auth-service. No X-Service-Key is set —
      # this worker receives no internal calls — so the service-principal scope is empty.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServicePermissions: ""
      # Email dispatch is opt-in; with no SMTP host configured the alert still
      # lands in logs and in the ams_lifecycle_alerts_total metric.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-25}
      Smtp__From: ${SMTP_FROM:-ams-noreply@plant.local}
    ports:
      - "8096:8080"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]  # aspnet image has no wget/curl
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 3 — Template Service
  # Reusable element templates with parameterized bindings
  # ─────────────────────────────────────────────
  template-service:
    build:
      context: ../../src/services/template-service
    container_name: traverse-template-service
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseTemplates: Host=postgres;Port=5432;Database=traverse_templates;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      Redis__Host:     redis
      Redis__Port:     "6379"
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Receives no internal X-Service-Key calls → principal can do nothing.
      Auth__ServicePermissions: ""
    ports:
      - "5004:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]  # aspnet image has no wget/curl; /dev/tcp works
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 4 — Analysis Service
  # Design-time CRUD for analyses; execution on Flink
  # ─────────────────────────────────────────────
  analysis-service:
    build:
      context: ../../src/services/analysis-service
    container_name: traverse-analysis-service
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseAnalysis: Host=postgres;Port=5432;Database=traverse_analysis;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      Redis__Host:        redis
      Redis__Port:        "6379"
      Kafka__Brokers:     kafka:9092
      Flink__JobManagerUrl: http://flink-jobmanager:8081
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Sends the key to asset-model (derived-asset registration) but receives no internal calls → nothing.
      Auth__ServicePermissions: ""
    ports:
      - "5005:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]  # aspnet image has no wget/curl; /dev/tcp works
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # CPLM API (extraction plan Phase 2) — loop-performance service.
  # Phase 2: skeleton only (auth/health/metrics). Controllers arrive in
  # Phase 3; the Kafka result consumers in Phase 4 (HARD cutover — the
  # consumer group must never run in two processes at once).
  # ─────────────────────────────────────────────
  cplm-api:
    build:
      context: ../../src/services/cplm-api
    container_name: traverse-cplm-api
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__CplmDb: Host=postgres;Port=5432;Database=traverse_cplm;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}
      Cpm__AssetModelUrl:    http://asset-model:5000
      # Same key ams-api uses — MUST match asset-model's Auth__ServiceKey or peer-link
      # projection 401s and G13 silently degrades to "no peers".
      Cpm__ServiceKey:       ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      Cpm__BootstrapServers: kafka:9092
      # Phase 5 (2026-08-06): cplm-api owns CPLM mutations; AMS.Api's copies are
      # deleted in Phase 6.
      Cpm__EnableMutations:  "true"
      # Phase 4 cutover flag — CUTOVER DONE 2026-08-06: this service owns the
      # ams-api-cplm-results(+-frames) groups. AMS.Api's matching flag must stay
      # false; two members in one group split partitions and silently halve
      # persistence.
      Cplm__ConsumersEnabled: "true"
      Flink__JobManagerUrl:  http://flink-jobmanager:8081
      Kafka__BootstrapServers: kafka:9092
      Services__BindingResolver: http://binding-resolver:5000
      # A8 recompute uploads this jar to the JobManager.
      CplmRecompute__JarPath: /opt/ams/flink/ams-flink.jar
      IotDb__RestUrl:        http://iotdb:8181
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Sends the key to asset-model but receives no internal calls itself → principal can do nothing.
      Auth__ServicePermissions: ""
    volumes:
      # A8 recompute cannot work without the jar — verified at Phase 5.2, not first click.
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/ams/flink/ams-flink.jar:ro
    ports:
      - "5006:5000"
    networks:
      - ams-backend
    healthcheck:
      # /health verifies current_database()=traverse_cplm, so use it rather than a bare TCP probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q Healthy <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 6 — IoTDB TTL / retention init (one-shot)
  # Sets storage group TTLs after IoTDB is healthy
  # ─────────────────────────────────────────────
  iotdb-init:
    image: apache/iotdb:1.3.2-standalone
    container_name: ams-iotdb-init
    depends_on:
      iotdb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/iotdb-init-ttl.sh"]
    volumes:
      - ./iotdb-init-ttl.sh:/iotdb-init-ttl.sh:ro
    environment:
      IOTDB_HOST: iotdb
      IOTDB_PORT: "6667"
      IOTDB_USER: ${IOTDB_USER:-root}
      IOTDB_PASS: ${IOTDB_PASSWORD:?IOTDB_PASSWORD must be set — change off the IoTDB default root/root}
    networks:
      - ams-backend
    restart: "no"

  # ─────────────────────────────────────────────
  # IoTDB Web Workbench — browser UI to query IoTDB
  # Sign in: http://localhost:8086/autologin.html  (root / 123456)
  # Then Data Connection → host iotdb, port 6667, user root, password root
  # ─────────────────────────────────────────────
  iotdb-workbench-init:
    image: alpine:3.20
    container_name: ams-iotdb-workbench-init
    depends_on:
      iotdb:
        condition: service_healthy
    volumes:
      - iotdb-workbench-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DB=/data/iotdb.db
        URL=https://raw.githubusercontent.com/apache/iotdb-web-workbench/master/backend/src/main/resources/sqlite/iotdb.db
        if [ -f "$$DB" ] && [ "$$(wc -c < "$$DB")" -lt 10000 ]; then
          echo "Removing invalid Workbench DB"
          rm -f "$$DB"
        fi
        if [ -s "$$DB" ]; then
          echo "Workbench DB already present"
          exit 0
        fi
        apk add --no-cache curl >/dev/null
        curl -fsSL -o "$$DB" "$$URL"
        echo "Workbench DB seeded ($$(wc -c < "$$DB") bytes)"
    networks:
      - ams-backend
    restart: "no"

  iotdb-workbench-backend:
    image: apache/iotdb-web-workbench:0.13.0-backend
    container_name: ams-iotdb-workbench-backend
    <<: *default-restart
    depends_on:
      iotdb:
        condition: service_healthy
      iotdb-workbench-init:
        condition: service_completed_successfully
    # Upstream image entrypoint references unset ${JAVA_MEM_OPTS}; override explicitly.
    # Needs ≥1GB container memory — 512M caused OOM restart loop (UI shows "Network error").
    entrypoint: ["java", "-Xms256m", "-Xmx768m", "-jar", "/app/app.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/iotdb.db
    volumes:
      - iotdb-workbench-data:/data
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9090' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s

  iotdb-workbench-frontend:
    image: apache/iotdb-web-workbench:0.13.0-frontend
    container_name: ams-iotdb-workbench-frontend
    <<: *default-restart
    depends_on:
      iotdb-workbench-backend:
        condition: service_healthy
    environment:
      BACKEND_ADDRESS: iotdb-workbench-backend:9090
    volumes:
      # Bundled login page is broken (submitForm); use this instead.
      - ./iotdb-workbench/autologin.html:/usr/share/nginx/html/autologin.html:ro
    ports:
      - "8086:80"
    networks:
      - ams-backend

  # ─────────────────────────────────────────────
  # Phase 1 — Flink → IoTDB persistence job submit
  # Submits IoTDBPersistenceJob once stack is healthy
  # ─────────────────────────────────────────────
  flink-job-submit-iotdb:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-submit-iotdb
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      iotdb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-iotdb-persistence.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:  ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:  "8081"
      KAFKA_BROKERS:          kafka:9092
      IOTDB_HOST:             iotdb
      IOTDB_PORT:             "6667"
      FLINK_JAR_PATH:         /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
    volumes:
      - ./flink-submit-iotdb-persistence.sh:/opt/flink-submit-iotdb-persistence.sh:ro
    networks:
      - ams-backend
    restart: "no"

  # ─────────────────────────────────────────────
  # Phase 2 — Flink live-state job submit
  # Submits LiveStateJob (live.alarms, live.metrics RBE)
  # ─────────────────────────────────────────────
  flink-job-submit-live-state:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-submit-live-state
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-live-state.sh"]
    environment:
      FLINK_JOBMANAGER_HOST: ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT: "8081"
      KAFKA_BROKERS:         kafka:9092
      FLINK_JAR_PATH:        /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
    volumes:
      - ./flink-submit-live-state.sh:/opt/flink-submit-live-state.sh:ro
    networks:
      - ams-backend
    restart: "no"

  # ─────────────────────────────────────────────
  # Phase 2 (CPLM) — three-stage pipeline submit
  # Short Feature → Long Diagnostics → Gate Fusion
  # (loop.samples.v1 → clpm.gate.results.v1)
  # ─────────────────────────────────────────────
  flink-job-submit-cplm:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-submit-cplm
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-cplm.sh"]
    environment:
      FLINK_JOBMANAGER_HOST: ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT: "8081"
      KAFKA_BROKERS:         kafka:9092
      FLINK_JAR_PATH:        /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      CPLM_INPUT_TOPIC:      loop.samples.v1
    volumes:
      - ./flink-submit-cplm.sh:/opt/flink-submit-cplm.sh:ro
    networks:
      - ams-backend
    restart: "no"

  # ─────────────────────────────────────────────
  # Flink job supervisor — standing loop that resubmits any of the six core
  # jobs (3 alarm baseline + 3 CPLM) that is not RUNNING. There is no JM HA:
  # a JobManager restart or Docker daemon bounce loses every job, and the
  # one-shot submit containers (restart: "no") do not rerun on their own.
  # ─────────────────────────────────────────────
  flink-job-supervisor:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-job-supervisor
    <<: *default-restart
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-job-supervisor.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:       ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:       "8081"
      KAFKA_BROKERS:               kafka:9092
      FLINK_JAR_PATH:              /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      SUPERVISOR_INTERVAL_SEC:     "60"
      RAW_ALARMS_STARTING_OFFSETS: earliest
      IOTDB_HOST:                  iotdb
      IOTDB_PORT:                  "6667"
    volumes:
      - ./flink-job-supervisor.sh:/opt/flink-job-supervisor.sh:ro
    networks:
      - ams-backend

  # ═════════════════════════════════════════════
  # Phase 6 — Hardening & Observability
  # ═════════════════════════════════════════════

  # ── Prometheus ────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ams-prometheus
    <<: *default-restart
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Grafana ───────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ams-grafana
    <<: *default-restart
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_SERVER_ROOT_URL:         http://localhost:3001
      GF_USERS_ALLOW_SIGN_UP:     "false"
      # Auto-provision Prometheus as default datasource
      GF_DATASOURCES_DEFAULT_URL: http://prometheus:9090
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis Exporter ────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: ams-redis-exporter
    <<: *default-restart
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - ams-backend

  # ── PostgreSQL Exporter ───────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ams-postgres-exporter
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://ams_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/docker/.env.example}@postgres:5432/ams?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - ams-backend

  # ── Kafka Exporter ────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: ams-kafka-exporter
    <<: *default-restart
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:9092"
      - "--web.listen-address=:9308"
    ports:
      - "9308:9308"
    networks:
      - ams-backend
