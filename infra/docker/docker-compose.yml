x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

networks:
  ams-backend:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  kafka_0_data:
  zookeeper_data:
  flink-checkpoints:
  # ── Phase 0: Edge platform historians & brokers ──
  iotdb-data:
  iotdb-logs:
  iotdb-ext:
  redis-data:
  emqx-data:
  emqx-log:

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ams-postgres
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    environment:
      POSTGRES_DB:       ams
      POSTGRES_USER:     ams_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams_user -d ams"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  # ─────────────────────────────────────────────
  # Phase 0 — IoTDB historian (standalone, 1.3.2)
  # Session API :6667 | REST v2 :8181 | Metrics :9091
  # ─────────────────────────────────────────────
  iotdb:
    image: apache/iotdb:1.3.2-standalone
    container_name: ams-iotdb
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2048M
    environment:
      enable_auto_create_schema: "true"
      IOTDB_JMX_LOCAL: "true"
    volumes:
      - iotdb-data:/iotdb/data
      - iotdb-logs:/iotdb/logs
      - iotdb-ext:/iotdb/ext
    ports:
      - "6667:6667"
      - "8181:8181"
      - "9091:9091"
    networks:
      - ams-backend
    healthcheck:
      # Session API :6667 is always enabled; REST :8181 requires opt-in config
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6667' 2>/dev/null && exit 0 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ─────────────────────────────────────────────
  # Phase 0 — Redis state-cache (7.2)
  # MQTT snapshot + alias registry :6379
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ams-redis
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"    # host:6380 → container:6379 (6379 taken by Docker backend)
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Phase 0 — EMQX MQTT broker (5.6, Sparkplug B)
  # TCP :1883 | WS :8083 | WSS :8084 | Dashboard :18083
  # ─────────────────────────────────────────────
  emqx:
    image: emqx/emqx:5.6.0
    container_name: ams-emqx
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      EMQX_NAME: "ams-emqx"
      EMQX_HOST: "127.0.0.1"
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1883"
      EMQX_LISTENERS__WS__DEFAULT__BIND: "0.0.0.0:8083"
      EMQX_LOG__CONSOLE__LEVEL: "warning"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ams-pgadmin
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - ams-backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: ams-zookeeper
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
      KAFKA_HEAP_OPTS:       "-Xmx128M -Xms128M"
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  kafka-ui:
      image: provectuslabs/kafka-ui:master
      container_name: kafka-ui
      ports:
        - "8085:8080"
      networks:
        - ams-backend
      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092,kafka-1:9093,kafka-2:9094
        KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: ams-kafka
    hostname: kafka
    <<: *default-restart
    depends_on:
      zookeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 768M
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENERS:                        INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:             INTERNAL://kafka:9092,EXTERNAL://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_NUM_PARTITIONS:                   4
      KAFKA_HEAP_OPTS:                        "-Xmx256M -Xms256M"
      KAFKA_LOG_RETENTION_HOURS:              "24"
      KAFKA_LOG_SEGMENT_BYTES:                "104857600"
    volumes:
      - kafka_0_data:/var/lib/kafka/data
    ports:
      - "9093:9093"
    networks:
      ams-backend:
        aliases:
          - kafka
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  flink-jobmanager:
    image: flink:1.18.1-java11
    container_name: ams-flink-jobmanager
    <<: *default-restart
    entrypoint: ["/bin/bash", "/opt/flink-entrypoint.sh"]
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1536M
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 1024m
        parallelism.default: 1
        state.backend: hashmap
        state.checkpoints.dir: file:///flink-checkpoints
      KAFKA_BROKERS: kafka:9092
      DB_URL:        jdbc:postgresql://postgres:5432/ams
      DB_USER:       ams_user
      DB_PASS:       ${POSTGRES_PASSWORD:-supersecurepassword123}
      IOTDB_HOST:    iotdb
      IOTDB_PORT:    "6667"
      IOTDB_USER:    root
      IOTDB_PASS:    root
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      - ./flink-entrypoint.sh:/opt/flink-entrypoint.sh:ro
    ports:
      - "8082:8081"
    networks:
      - ams-backend

  flink-taskmanager:
    image: flink:1.18.1-java11
    container_name: ams-flink-taskmanager
    <<: *default-restart
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-entrypoint.sh"]
    command: taskmanager
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1536M
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 16
        state.backend: hashmap
        state.checkpoints.dir: file:///flink-checkpoints
      KAFKA_BROKERS: kafka:9092
      DB_URL:        jdbc:postgresql://postgres:5432/ams
      DB_USER:       ams_user
      DB_PASS:       ${POSTGRES_PASSWORD:-supersecurepassword123}
      IOTDB_HOST:    iotdb
      IOTDB_PORT:    "6667"
      IOTDB_USER:    root
      IOTDB_PASS:    root
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ./flink-entrypoint.sh:/opt/flink-entrypoint.sh:ro
    networks:
      - ams-backend

  flink-job-submit:
    image: flink:1.18.1-java11
    container_name: ams-flink-job-submit
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-raw-alarms.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:       ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:       "8081"
      KAFKA_BROKERS:               kafka:9092
      RAW_ALARMS_STARTING_OFFSETS: earliest
      FLINK_JAR_PATH:              /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      FLINK_ENTRY_CLASS:           com.ams.flink.OpcEventStreamJob
    volumes:
      - ./flink-submit-raw-alarms.sh:/opt/flink-submit-raw-alarms.sh:ro
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar:ro
    networks:
      - ams-backend
    restart: "no"

  ams-api:
    build:
      context: ../../src/backend
      dockerfile: ../../infra/docker/api/Dockerfile
    container_name: ams-api
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      ASPNETCORE_ENVIRONMENT:   Development
      ASPNETCORE_URLS:          http://0.0.0.0:8000
      ASPNETCORE_HTTP_PORTS:    "8000"
      Urls:                     http://0.0.0.0:8000
      ConnectionStrings__AmsDb: Host=postgres;Port=5432;Database=ams;Username=ams_user;Password=${POSTGRES_PASSWORD:-supersecurepassword123}
      Kafka__BootstrapServers:  kafka:9092
      Kafka__IngestAuthority:        api
      Kafka__ConsumerGroupId:        ams-backend-2
      Kafka__RawAlarmsTopic:         raw-alarms
      Flink__JobManagerUrl:          http://flink-jobmanager:8081
      AlarmIngestion__Enabled:       "true"
      AlarmIngestion__FeedUrl:          http://192.168.1.51:8010/api/current-alarms
      AlarmIngestion__AckWritebackUrl:  http://192.168.1.51:8010/api/alarms/acknowledge
      AlarmIngestion__PollIntervalMs: "2000"
      AlarmIngestion__ServerId:      "f0af9a6d-85f6-4c9f-a8ad-6de277d1d110"
      AlarmIngestion__ServerName:    "Current Alarms Feed"
    ports:
      - "8000:8000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s

  ams-frontend:
    build:
      context: ../../src/frontend-ob
      dockerfile: ../../infra/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_SIGNALR_HUB_URL: /hubs/alarms
    container_name: ams-frontend
    <<: *default-restart
    depends_on:
      ams-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    environment:
      VITE_API_BASE_URL:     http://ams-api:8000
      VITE_SIGNALR_HUB_URL: http://ams-api:8000/hubs/alarms
    ports:
      - "3000:80"
    networks:
      - ams-backend

  # ─────────────────────────────────────────────
  # Phase 1 — Flink → IoTDB persistence job submit
  # Submits IoTDBPersistenceJob once stack is healthy
  # ─────────────────────────────────────────────
  flink-job-submit-iotdb:
    image: flink:1.18.1-java11
    container_name: ams-flink-submit-iotdb
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      iotdb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-iotdb-persistence.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:  ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:  "8081"
      KAFKA_BROKERS:          kafka:9092
      IOTDB_HOST:             iotdb
      IOTDB_PORT:             "6667"
      FLINK_JAR_PATH:         /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
    volumes:
      - ./flink-submit-iotdb-persistence.sh:/opt/flink-submit-iotdb-persistence.sh:ro
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar:ro
    networks:
      - ams-backend
    restart: "no"

  # ─────────────────────────────────────────────
  # Phase 2 — Flink live-state job submit
  # Submits LiveStateJob (live.alarms, live.metrics RBE)
  # ─────────────────────────────────────────────
  flink-job-submit-live-state:
    image: flink:1.18.1-java11
    container_name: ams-flink-submit-live-state
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-live-state.sh"]
    environment:
      FLINK_JOBMANAGER_HOST: ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT: "8081"
      KAFKA_BROKERS:         kafka:9092
      FLINK_JAR_PATH:        /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
    volumes:
      - ./flink-submit-live-state.sh:/opt/flink-submit-live-state.sh:ro
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar:ro
    networks:
      - ams-backend
    restart: "no"
