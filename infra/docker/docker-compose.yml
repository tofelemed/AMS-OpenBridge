x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

networks:
  ams-backend:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  kafka_0_data:
  zookeeper_data:
  flink-checkpoints:
  # ── Phase 0: Edge platform historians & brokers ──
  iotdb-data:
  iotdb-logs:
  iotdb-ext:
  iotdb-workbench-data:
  redis-data:
  emqx-data:
  emqx-log:
  # ── Phase 6: Observability ──
  prometheus-data:
  grafana-data:

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ams-postgres
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    environment:
      POSTGRES_DB:       ams
      POSTGRES_USER:     ams_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams_user -d ams"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  # ─────────────────────────────────────────────
  # Phase 0 — IoTDB historian (standalone, 1.3.2)
  # Session API :6667 | REST v2 :8181 | Metrics :9091
  # ─────────────────────────────────────────────
  iotdb:
    image: apache/iotdb:1.3.2-standalone
    container_name: ams-iotdb
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2048M
    environment:
      enable_auto_create_schema: "true"
      IOTDB_JMX_LOCAL: "true"
      # Enable REST API v2 (required by historian-bff / Flink IoTDB connector)
      enable_rest_service: "true"
      rest_service_port: "8181"
    volumes:
      - iotdb-data:/iotdb/data
      - iotdb-logs:/iotdb/logs
      - iotdb-ext:/iotdb/ext
    ports:
      - "6667:6667"
      - "8181:8181"
      - "9091:9091"
    networks:
      - ams-backend
    healthcheck:
      # Session :6667 + REST :8181 (historian-bff queries REST v2)
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6667' 2>/dev/null && bash -c 'echo > /dev/tcp/localhost/8181' 2>/dev/null && exit 0 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ─────────────────────────────────────────────
  # Phase 0 — Redis state-cache (7.2)
  # MQTT snapshot + alias registry :6379
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ams-redis
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"    # host:6380 → container:6379 (6379 taken by Docker backend)
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Phase 0 — EMQX MQTT broker (5.6, Sparkplug B)
  # TCP :1883 | WS :8083 | WSS :8084 | Dashboard :18083
  # ─────────────────────────────────────────────
  emqx:
    image: emqx/emqx:5.6.0
    container_name: ams-emqx
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      EMQX_NAME: "ams-emqx"
      EMQX_HOST: "127.0.0.1"
      # ── Auth ──────────────────────────────────────────────────────────────
      # EMQX 5.x: anonymous access is controlled via the 'allow_anonymous'
      # key inside the built-in auth chain, NOT EMQX_ALLOW_ANONYMOUS.
      # Setting it to true lets the E2E test client (no creds) connect for
      # DDATA subscription without provisioning a separate user.
      # The sparkplug-edge-node still sends MQTT_USERNAME/PASSWORD which EMQX
      # accepts even with anonymous=true (credentials are validated if provided).
      EMQX_MQTT__MAX_PACKET_SIZE: "1MB"
      # EMQX 5.x anonymous auth — allow unauthenticated connections
      EMQX_ALLOW_ANONYMOUS: "true"
      # ── Listeners ─────────────────────────────────────────────────────────
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1883"
      EMQX_LISTENERS__WS__DEFAULT__BIND:  "0.0.0.0:8083"
      # ── Logging ───────────────────────────────────────────────────────────
      EMQX_LOG__CONSOLE__LEVEL: "warning"
      # ── Dashboard ─────────────────────────────────────────────────────────
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-changeme_emqx}
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ams-pgadmin
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - ams-backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: ams-zookeeper
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
      KAFKA_HEAP_OPTS:       "-Xmx128M -Xms128M"
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  kafka-ui:
      image: provectuslabs/kafka-ui:master
      container_name: kafka-ui
      ports:
        - "8085:8080"
      networks:
        - ams-backend
      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092,kafka-1:9093,kafka-2:9094
        KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: ams-kafka
    hostname: kafka
    <<: *default-restart
    depends_on:
      zookeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 768M
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENERS:                        INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:             INTERNAL://kafka:9092,EXTERNAL://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_NUM_PARTITIONS:                   4
      KAFKA_HEAP_OPTS:                        "-Xmx256M -Xms256M"
      KAFKA_LOG_RETENTION_HOURS:              "24"
      KAFKA_LOG_SEGMENT_BYTES:                "104857600"
    volumes:
      - kafka_0_data:/var/lib/kafka/data
    ports:
      - "9093:9093"
    networks:
      ams-backend:
        aliases:
          - kafka
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  flink-jobmanager:
    image: flink:1.18.1-java11
    container_name: ams-flink-jobmanager
    <<: *default-restart
    entrypoint: ["/bin/bash", "/opt/flink-entrypoint.sh"]
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1536M
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 1024m
        parallelism.default: 1
        # Phase 6: RocksDB state backend for large keyed state (RBE fingerprints)
        state.backend: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///flink-checkpoints
        # Phase 6: checkpoint hardening — 60s interval, 30s min pause, EXACTLY_ONCE
        execution.checkpointing.interval: 60000
        execution.checkpointing.min-pause: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 120000
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        # Phase 6: Prometheus metrics reporter on :9249
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      KAFKA_BROKERS: kafka:9092
      DB_URL:        jdbc:postgresql://postgres:5432/ams
      DB_USER:       ams_user
      DB_PASS:       ${POSTGRES_PASSWORD:-supersecurepassword123}
      IOTDB_HOST:    iotdb
      IOTDB_PORT:    "6667"
      IOTDB_USER:    root
      IOTDB_PASS:    root
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      - ./flink-entrypoint.sh:/opt/flink-entrypoint.sh:ro
    ports:
      - "8082:8081"
      - "9249:9249"
    networks:
      - ams-backend

  flink-taskmanager:
    image: flink:1.18.1-java11
    container_name: ams-flink-taskmanager
    <<: *default-restart
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-entrypoint.sh"]
    command: taskmanager
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1536M
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 16
        # Phase 6: consistent settings with jobmanager
        state.backend: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///flink-checkpoints
        execution.checkpointing.interval: 60000
        execution.checkpointing.min-pause: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 120000
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      KAFKA_BROKERS: kafka:9092
      DB_URL:        jdbc:postgresql://postgres:5432/ams
      DB_USER:       ams_user
      DB_PASS:       ${POSTGRES_PASSWORD:-supersecurepassword123}
      IOTDB_HOST:    iotdb
      IOTDB_PORT:    "6667"
      IOTDB_USER:    root
      IOTDB_PASS:    root
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ./flink-entrypoint.sh:/opt/flink-entrypoint.sh:ro
    networks:
      - ams-backend

  flink-job-submit:
    image: flink:1.18.1-java11
    container_name: ams-flink-job-submit
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-raw-alarms.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:       ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:       "8081"
      KAFKA_BROKERS:               kafka:9092
      RAW_ALARMS_STARTING_OFFSETS: earliest
      FLINK_JAR_PATH:              /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      FLINK_ENTRY_CLASS:           com.ams.flink.OpcEventStreamJob
    volumes:
      - ./flink-submit-raw-alarms.sh:/opt/flink-submit-raw-alarms.sh:ro
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar:ro
    networks:
      - ams-backend
    restart: "no"

  ams-api:
    build:
      context: ../../src/backend
      dockerfile: ../../infra/docker/api/Dockerfile
    container_name: ams-api
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      ASPNETCORE_ENVIRONMENT:   Development
      ASPNETCORE_URLS:          http://0.0.0.0:8000
      ASPNETCORE_HTTP_PORTS:    "8000"
      Urls:                     http://0.0.0.0:8000
      ConnectionStrings__AmsDb: Host=postgres;Port=5432;Database=ams;Username=ams_user;Password=${POSTGRES_PASSWORD:-supersecurepassword123}
      Kafka__BootstrapServers:  kafka:9092
      Kafka__IngestAuthority:        api
      Kafka__ConsumerGroupId:        ams-backend-2
      Kafka__RawAlarmsTopic:         raw-alarms
      Flink__JobManagerUrl:          http://flink-jobmanager:8081
      AlarmIngestion__Enabled:       "true"
      AlarmIngestion__FeedUrl:          http://192.168.1.51:8010/api/current-alarms
      AlarmIngestion__AckWritebackUrl:  http://192.168.1.51:8010/api/alarms/acknowledge
      AlarmIngestion__PollIntervalMs: "2000"
      AlarmIngestion__ServerId:      "f0af9a6d-85f6-4c9f-a8ad-6de277d1d110"
      AlarmIngestion__ServerName:    "Current Alarms Feed"
    ports:
      - "8000:8000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s

  ams-frontend:
    build:
      context: ../../src/frontend-ob
      dockerfile: ../../infra/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_SIGNALR_HUB_URL: /hubs/alarms
        # Phase 5/6: MQTT + Historian BFF routes (nginx proxies /mqtt-ws and /api/hist)
        VITE_MQTT_WS_URL: /mqtt-ws
        VITE_SNAPSHOT_URL: /api/hist/snapshot
        VITE_HIST_URL: /api/hist
        VITE_SPARKPLUG_GROUP: ams_site1
        VITE_SPARKPLUG_EDGE: ams_edge1
    container_name: ams-frontend
    <<: *default-restart
    depends_on:
      ams-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    environment:
      VITE_API_BASE_URL:     http://ams-api:8000
      VITE_SIGNALR_HUB_URL: http://ams-api:8000/hubs/alarms
    ports:
      - "3000:80"
    networks:
      - ams-backend

  # ─────────────────────────────────────────────
  # Phase 3 — Sparkplug B Edge Node
  # Kafka(live.alarms, live.metrics) → EMQX → HMI
  # Also writes Redis snapshot cache
  # ─────────────────────────────────────────────
  sparkplug-edge-node:
    build:
      context: ../../src/services/sparkplug-edge-node
    container_name: ams-sparkplug-edge-node
    <<: *default-restart
    depends_on:
      kafka:
        condition: service_healthy
      emqx:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      KAFKA_BROKERS:            kafka:9092
      LIVE_ALARMS_TOPIC:        live.alarms
      LIVE_METRICS_TOPIC:       live.metrics
      KAFKA_GROUP_ID:           ams-sparkplug-edge-node
      # earliest = replay existing messages on startup (needed for E2E tests)
      KAFKA_AUTO_OFFSET_RESET:  earliest
      MQTT_HOST:                emqx
      MQTT_PORT:          "1883"
      MQTT_CLIENT_ID:     ams-edge-node-1
      MQTT_WS:            "false"
      # Phase 6: MQTT auth credentials (matches EMQX built-in auth user)
      MQTT_USERNAME:      ${EMQX_EDGE_USER:-ams_edge}
      MQTT_PASSWORD:      ${EMQX_EDGE_PASSWORD:-changeme_edge}
      SPARKPLUG_GROUP:    ams_site1
      SPARKPLUG_EDGE:     ams_edge1
      REDIS_HOST:         redis
      REDIS_PORT:         "6379"
      REDIS_TTL_SECS:     "3600"
    networks:
      - ams-backend

  # ─────────────────────────────────────────────
  # Phase 4 — Historian BFF (.NET 8 Minimal API)
  # /trend, /raw → IoTDB REST v2
  # /snapshot    → Redis
  # ─────────────────────────────────────────────
  historian-bff:
    build:
      context: ../../src/services/historian-bff
    container_name: ams-historian-bff
    <<: *default-restart
    depends_on:
      iotdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8090
      IoTDB__RestUrl:  http://iotdb:8181
      Redis__Host:     redis
      Redis__Port:     "6379"
    ports:
      - "8090:8090"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 1 — Asset Model Service (UNS source of truth)
  # REST API for asset hierarchy and UNS path resolution
  # ─────────────────────────────────────────────
  asset-model:
    build:
      context: ../../src/services/asset-model
    container_name: traverse-asset-model
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseAssets: Host=postgres;Port=5432;Database=traverse_assets;Username=ams_user;Password=${POSTGRES_PASSWORD:-postgres}
      Redis__Host:     redis
      Redis__Port:     "6379"
    ports:
      - "5001:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 1 — Binding Resolver BFF
  # Resolves UNS path + role → transport (live/history/alarm)
  # ─────────────────────────────────────────────
  binding-resolver:
    build:
      context: ../../src/services/binding-resolver
    container_name: traverse-binding-resolver
    <<: *default-restart
    depends_on:
      redis:
        condition: service_healthy
      asset-model:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      Redis__Host:         redis
      Redis__Port:         "6379"
      Mqtt__Host:          emqx
      Mqtt__WebSocketPort: "8083"
      Mqtt__Protocol:      ws
      Services__AssetModel:    http://asset-model:5000
      Services__HistorianBff:  http://historian-bff:8090
      Services__AmsApi:        http://ams-api:8000
    ports:
      - "5002:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 2 — Display Service
  # CRUD for HMI display definitions (versioned, no process values)
  # ─────────────────────────────────────────────
  display-service:
    build:
      context: ../../src/services/display-service
    container_name: traverse-display-service
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseDisplays: Host=postgres;Port=5432;Database=traverse_displays;Username=ams_user;Password=${POSTGRES_PASSWORD:-postgres}
      Redis__Host:     redis
      Redis__Port:     "6379"
    ports:
      - "5003:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 3 — Template Service
  # Reusable element templates with parameterized bindings
  # ─────────────────────────────────────────────
  template-service:
    build:
      context: ../../src/services/template-service
    container_name: traverse-template-service
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseTemplates: Host=postgres;Port=5432;Database=traverse_templates;Username=ams_user;Password=${POSTGRES_PASSWORD:-postgres}
      Redis__Host:     redis
      Redis__Port:     "6379"
    ports:
      - "5004:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 4 — Analysis Service
  # Design-time CRUD for analyses; execution on Flink
  # ─────────────────────────────────────────────
  analysis-service:
    build:
      context: ../../src/services/analysis-service
    container_name: traverse-analysis-service
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseAnalysis: Host=postgres;Port=5432;Database=traverse_analysis;Username=ams_user;Password=${POSTGRES_PASSWORD:-postgres}
      Redis__Host:        redis
      Redis__Port:        "6379"
      Kafka__Brokers:     kafka:9092
      Flink__JobManagerUrl: http://flink-jobmanager:8081
    ports:
      - "5005:5000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Phase 6 — IoTDB TTL / retention init (one-shot)
  # Sets storage group TTLs after IoTDB is healthy
  # ─────────────────────────────────────────────
  iotdb-init:
    image: apache/iotdb:1.3.2-standalone
    container_name: ams-iotdb-init
    depends_on:
      iotdb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/iotdb-init-ttl.sh"]
    volumes:
      - ./iotdb-init-ttl.sh:/iotdb-init-ttl.sh:ro
    environment:
      IOTDB_HOST: iotdb
      IOTDB_PORT: "6667"
      IOTDB_USER: root
      IOTDB_PASS: root
    networks:
      - ams-backend
    restart: "no"

  # ─────────────────────────────────────────────
  # IoTDB Web Workbench — browser UI to query IoTDB
  # Sign in: http://localhost:8086/autologin.html  (root / 123456)
  # Then Data Connection → host iotdb, port 6667, user root, password root
  # ─────────────────────────────────────────────
  iotdb-workbench-init:
    image: alpine:3.20
    container_name: ams-iotdb-workbench-init
    depends_on:
      iotdb:
        condition: service_healthy
    volumes:
      - iotdb-workbench-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DB=/data/iotdb.db
        URL=https://raw.githubusercontent.com/apache/iotdb-web-workbench/master/backend/src/main/resources/sqlite/iotdb.db
        if [ -f "$$DB" ] && [ "$$(wc -c < "$$DB")" -lt 10000 ]; then
          echo "Removing invalid Workbench DB"
          rm -f "$$DB"
        fi
        if [ -s "$$DB" ]; then
          echo "Workbench DB already present"
          exit 0
        fi
        apk add --no-cache curl >/dev/null
        curl -fsSL -o "$$DB" "$$URL"
        echo "Workbench DB seeded ($$(wc -c < "$$DB") bytes)"
    networks:
      - ams-backend
    restart: "no"

  iotdb-workbench-backend:
    image: apache/iotdb-web-workbench:0.13.0-backend
    container_name: ams-iotdb-workbench-backend
    <<: *default-restart
    depends_on:
      iotdb:
        condition: service_healthy
      iotdb-workbench-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1536M
    # Upstream image entrypoint references unset ${JAVA_MEM_OPTS}; override explicitly.
    # Needs ≥1GB container memory — 512M caused OOM restart loop (UI shows "Network error").
    entrypoint: ["java", "-Xms256m", "-Xmx768m", "-jar", "/app/app.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/iotdb.db
    volumes:
      - iotdb-workbench-data:/data
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9090' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s

  iotdb-workbench-frontend:
    image: apache/iotdb-web-workbench:0.13.0-frontend
    container_name: ams-iotdb-workbench-frontend
    <<: *default-restart
    depends_on:
      iotdb-workbench-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    environment:
      BACKEND_ADDRESS: iotdb-workbench-backend:9090
    volumes:
      # Bundled login page is broken (submitForm); use this instead.
      - ./iotdb-workbench/autologin.html:/usr/share/nginx/html/autologin.html:ro
    ports:
      - "8086:80"
    networks:
      - ams-backend

  # ─────────────────────────────────────────────
  # Phase 1 — Flink → IoTDB persistence job submit
  # Submits IoTDBPersistenceJob once stack is healthy
  # ─────────────────────────────────────────────
  flink-job-submit-iotdb:
    image: flink:1.18.1-java11
    container_name: ams-flink-submit-iotdb
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      iotdb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-iotdb-persistence.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:  ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:  "8081"
      KAFKA_BROKERS:          kafka:9092
      IOTDB_HOST:             iotdb
      IOTDB_PORT:             "6667"
      FLINK_JAR_PATH:         /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
    volumes:
      - ./flink-submit-iotdb-persistence.sh:/opt/flink-submit-iotdb-persistence.sh:ro
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar:ro
    networks:
      - ams-backend
    restart: "no"

  # ─────────────────────────────────────────────
  # Phase 2 — Flink live-state job submit
  # Submits LiveStateJob (live.alarms, live.metrics RBE)
  # ─────────────────────────────────────────────
  flink-job-submit-live-state:
    image: flink:1.18.1-java11
    container_name: ams-flink-submit-live-state
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-live-state.sh"]
    environment:
      FLINK_JOBMANAGER_HOST: ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT: "8081"
      KAFKA_BROKERS:         kafka:9092
      FLINK_JAR_PATH:        /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
    volumes:
      - ./flink-submit-live-state.sh:/opt/flink-submit-live-state.sh:ro
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar:ro
    networks:
      - ams-backend
    restart: "no"

  # ═════════════════════════════════════════════
  # Phase 6 — Hardening & Observability
  # ═════════════════════════════════════════════

  # ── Prometheus ────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ams-prometheus
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Grafana ───────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ams-grafana
    <<: *default-restart
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL:         http://localhost:3001
      GF_USERS_ALLOW_SIGN_UP:     "false"
      # Auto-provision Prometheus as default datasource
      GF_DATASOURCES_DEFAULT_URL: http://prometheus:9090
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis Exporter ────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: ams-redis-exporter
    <<: *default-restart
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - ams-backend

  # ── PostgreSQL Exporter ───────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ams-postgres-exporter
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    environment:
      DATA_SOURCE_NAME: "postgresql://ams_user:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ams?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - ams-backend

  # ── Kafka Exporter ────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: ams-kafka-exporter
    <<: *default-restart
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    command:
      - "--kafka.server=kafka:9092"
      - "--web.listen-address=:9308"
    ports:
      - "9308:9308"
    networks:
      - ams-backend
