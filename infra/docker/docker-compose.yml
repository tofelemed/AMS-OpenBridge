  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 4 â€” Analysis Service
  # Design-time CRUD for analyses; execution on Flink
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  analysis-service:
    build:
      context: ../../src/services/analysis-service
    container_name: traverse-analysis-service
    logging: *default-logging
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__TraverseAnalysis: Host=postgres;Port=5432;Database=traverse_analysis;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set â€” see infra/docker/.env.example}
      Redis__Host:        redis-contract   # DATA-03: contract tier (snapshots)
      Redis__Password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      Redis__Port:        "6379"
      Kafka__Brokers:     kafka:9092
      Flink__JobManagerUrl: http://flink-jobmanager:8081
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Sends the key to asset-model (derived-asset registration) but receives no internal calls â†’ nothing.
      Auth__ServicePermissions: ""
    # FINAL LOCKDOWN (Plan 04): no published port — reachable only through the gateway (8081) / compose network. See docs/api-gateway.md.
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000' || exit 1"]  # aspnet image has no wget/curl; /dev/tcp works
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # CPLM API (extraction plan Phase 2) â€” loop-performance service.
  # Phase 2: skeleton only (auth/health/metrics). Controllers arrive in
  # Phase 3; the Kafka result consumers in Phase 4 (HARD cutover â€” the
  # consumer group must never run in two processes at once).
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  cplm-api:
    build:
      context: ../../src/services/cplm-api
    container_name: traverse-cplm-api
    logging: *default-logging
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__CplmDb: Host=postgres;Port=5432;Database=traverse_cplm;Username=ams_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set â€” see infra/docker/.env.example}
      Cpm__AssetModelUrl:    http://asset-model:5000
      # Same key ams-api uses â€” MUST match asset-model's Auth__ServiceKey or peer-link
      # projection 401s and G13 silently degrades to "no peers".
      Cpm__ServiceKey:       ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      Cpm__BootstrapServers: kafka:9092
      # Phase 5 (2026-08-06): cplm-api owns CPLM mutations; AMS.Api's copies are
      # deleted in Phase 6.
      Cpm__EnableMutations:  "true"
      # Phase 4 cutover flag â€” CUTOVER DONE 2026-08-06: this service owns the
      # traverse-cpa-cplm-results(+-frames) groups. AMS.Api's matching flag must stay
      # false; two members in one group split partitions and silently halve
      # persistence.
      Cplm__ConsumersEnabled: "true"
      Flink__JobManagerUrl:  http://flink-jobmanager:8081
      Kafka__BootstrapServers: kafka:9092
      Services__BindingResolver: http://binding-resolver:5000
      # A8 recompute uploads this jar to the JobManager.
      CplmRecompute__JarPath: /opt/ams/flink/ams-flink.jar
      IotDb__RestUrl:        http://iotdb:8181
      # Platform auth (RBAC): validate RS256 tokens from auth-service; X-Service-Key authenticates
      # internal service-to-service calls that carry no user token.
      Auth__JwksUrl:   http://auth-service:3002/api/auth/.well-known/jwks.json
      Auth__Issuer:    traverse-auth
      Auth__Audience:  ams-services
      Auth__ServiceKey: ${TRAVERSE_SERVICE_KEY:?TRAVERSE_SERVICE_KEY must be set (generate with openssl rand -hex 24)}
      # Sends the key to asset-model but receives no internal calls itself â†’ principal can do nothing.
      # Receives ONE internal call: asset-model's cross-DB delete guard
      # (GET /api/v1/cpm/loops/referencing, G-02) - a read, so the service
      # principal gets exactly analytics.view and nothing else.
      Auth__ServicePermissions: "analytics.view"
    volumes:
      # A8 recompute cannot work without the jar â€” verified at Phase 5.2, not first click.
      - ../../src/flink/target/ams-flink-1.0-SNAPSHOT.jar:/opt/ams/flink/ams-flink.jar:ro
    # FINAL LOCKDOWN (Plan 04): no published port — reachable only through the gateway (8081) / compose network. See docs/api-gateway.md.
    networks:
      - ams-backend
    healthcheck:
      # /health verifies current_database()=traverse_cplm, so use it rather than a bare TCP probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5000 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q Healthy <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 6 â€” IoTDB TTL / retention init (one-shot)
  # Sets storage group TTLs after IoTDB is healthy
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  iotdb-init:
    image: apache/iotdb:1.3.2-standalone
    container_name: ams-iotdb-init
    logging: *default-logging
    depends_on:
      iotdb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/iotdb-init-ttl.sh"]
    volumes:
      - ./iotdb-init-ttl.sh:/iotdb-init-ttl.sh:ro
    environment:
      IOTDB_HOST: iotdb
      IOTDB_PORT: "6667"
      IOTDB_USER: ${IOTDB_USER:-root}
      IOTDB_PASS: ${IOTDB_PASSWORD:?IOTDB_PASSWORD must be set â€” change off the IoTDB default root/root}
    networks:
      - ams-backend
    restart: "no"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 1 â€” Flink â†’ IoTDB persistence job submit
  # Submits IoTDBPersistenceJob once stack is healthy
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  flink-job-submit-iotdb:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-submit-iotdb
    logging: *default-logging
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      iotdb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-iotdb-persistence.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:  ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:  "8081"
      KAFKA_BROKERS:          kafka:9092
      IOTDB_HOST:             iotdb
      IOTDB_PORT:             "6667"
      FLINK_JAR_PATH:         /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
    volumes:
      - ./flink-submit-iotdb-persistence.sh:/opt/flink-submit-iotdb-persistence.sh:ro
    networks:
      - ams-backend
    restart: "no"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 2 â€” Flink live-state job submit
  # Submits LiveStateJob (traverse.alarm.live.alarms + traverse.alarm.live.alarm.metrics RBE)
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  flink-job-submit-live-state:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-submit-live-state
    logging: *default-logging
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-live-state.sh"]
    environment:
      FLINK_JOBMANAGER_HOST: ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT: "8081"
      KAFKA_BROKERS:         kafka:9092
      FLINK_JAR_PATH:        /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
    volumes:
      - ./flink-submit-live-state.sh:/opt/flink-submit-live-state.sh:ro
    networks:
      - ams-backend
    restart: "no"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Phase 2 (CPLM) â€” three-stage pipeline submit
  # Short Feature â†’ Long Diagnostics â†’ Gate Fusion
  # (traverse.cpa.loop.samples.v1 â†’ traverse.cpa.clpm.gate.results.v1)
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  flink-job-submit-cplm:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-submit-cplm
    logging: *default-logging
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-submit-cplm.sh"]
    environment:
      FLINK_JOBMANAGER_HOST: ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT: "8081"
      KAFKA_BROKERS:         kafka:9092
      FLINK_JAR_PATH:        /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      CPLM_INPUT_TOPIC:      traverse.cpa.loop.samples.v1
    volumes:
      - ./flink-submit-cplm.sh:/opt/flink-submit-cplm.sh:ro
    networks:
      - ams-backend
    restart: "no"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Flink job supervisor â€” standing loop that resubmits any of the TEN standing
  # jobs (see flink-job-supervisor.sh, kept in step with ensure_flink_jobs.py)
  # that is not RUNNING. The one-shot submit containers (restart: "no") do not
  # rerun on their own; ZooKeeper JM HA exists but recovers OLD job graphs, so
  # the supervisor remains the code-upgrade path (cancel -> resubmit).
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  flink-job-supervisor:
    build:
      context: ../../src/flink
      dockerfile: ../../infra/docker/flink/Dockerfile
    image: ams-flink:1.0-SNAPSHOT
    container_name: ams-flink-job-supervisor
    logging: *default-logging
    <<: *default-restart
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/flink-job-supervisor.sh"]
    environment:
      FLINK_JOBMANAGER_HOST:       ams-flink-jobmanager
      FLINK_JOBMANAGER_PORT:       "8081"
      KAFKA_BROKERS:               kafka:9092
      FLINK_JAR_PATH:              /opt/flink/usrlib/ams-flink-1.0-SNAPSHOT.jar
      SUPERVISOR_INTERVAL_SEC:     "60"
      # Prod item 4 (2026-08-17): resume from the consumer group's committed offsets
      # (earliest only on a true first deploy). "earliest" made every fresh submit
      # replay the whole traverse.alarm.raw-alarms topic — idempotent downstream, but a burst of
      # thousands of re-upserts through CAS/SignalR/historian on each JM incident.
      RAW_ALARMS_STARTING_OFFSETS: committed
      IOTDB_HOST:                  iotdb
      IOTDB_PORT:                  "6667"
    volumes:
      - ./flink-job-supervisor.sh:/opt/flink-job-supervisor.sh:ro
    networks:
      - ams-backend

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # Phase 6 â€” Hardening & Observability
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  # â”€â”€ Prometheus â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # ── Alertmanager (Plan 08 item 2) ─────────────────────────────────────────
  # Dev-null receiver — alerts visible in its UI, nobody notified. Production
  # swaps the receiver in alertmanager.yml. Not published on the host; reach it
  # via the compose network (prometheus already routes alerts to it).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ams-alertmanager
    logging: *default-logging
    <<: *default-restart
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ams-prometheus
    logging: *default-logging
    <<: *default-restart
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      # --web.enable-admin-api removed (Plan 08 item 4): it allowed anonymous
      # TSDB deletion on a published port. Lifecycle (config reload) stays.
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # â”€â”€ Grafana â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ams-grafana
    logging: *default-logging
    <<: *default-restart
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_SERVER_ROOT_URL:         http://localhost:3001
      GF_USERS_ALLOW_SIGN_UP:     "false"
      # Air-gap: never hit grafana.com on boot (plugin store / news / analytics).
      GF_INSTALL_PLUGINS: ""
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_CHECK_FOR_UPDATES: "false"
      # Auto-provision Prometheus as default datasource
      GF_DATASOURCES_DEFAULT_URL: http://prometheus:9090
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - ams-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # â”€â”€ Redis Exporter â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: ams-redis-exporter
    logging: *default-logging
    <<: *default-restart
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - ams-backend

  # â”€â”€ PostgreSQL Exporter â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ams-postgres-exporter
    logging: *default-logging
    <<: *default-restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://ams_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set â€” see infra/docker/.env.example}@postgres:5432/ams?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - ams-backend

  # â”€â”€ Kafka Exporter â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: ams-kafka-exporter
    logging: *default-logging
    <<: *default-restart
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:9092"
      - "--web.listen-address=:9308"
    ports:
      - "9308:9308"
    networks:
      - ams-backend
