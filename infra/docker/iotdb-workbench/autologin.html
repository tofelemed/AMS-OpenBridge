<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IoTDB Workbench — Sign in</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 48px auto; padding: 0 16px; color: #1f2937; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 0.9rem; line-height: 1.5; }
    label { display: block; margin-top: 12px; font-size: 0.85rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { margin-top: 16px; width: 100%; padding: 10px; border: none; border-radius: 6px; background: #31598f; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .err { color: #b91c1c; margin-top: 12px; font-size: 0.85rem; white-space: pre-wrap; }
    .ok { color: #15803d; margin-top: 12px; font-size: 0.85rem; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>IoTDB Workbench</h1>
  <p>
    The bundled login button in Workbench 0.13.0 is broken in modern browsers.
    Use this page instead, then you will be redirected to the main UI.
  </p>
  <p>Default credentials: <code>root</code> / <code>123456</code></p>

  <label for="user">Username</label>
  <input id="user" value="root" autocomplete="username" />

  <label for="pass">Password</label>
  <input id="pass" type="password" value="123456" autocomplete="current-password" />

  <button id="btn" type="button">Sign in</button>
  <div id="msg"></div>

  <script>
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    async function signIn() {
      btn.disabled = true;
      msg.className = '';
      msg.textContent = 'Signing in…';
      const name = document.getElementById('user').value.trim();
      const password = document.getElementById('pass').value;
      try {
        const res = await fetch('/api/login?name=' + encodeURIComponent(name) + '&password=' + encodeURIComponent(password), {
          method: 'POST',
        });
        const auth = res.headers.get('authorization') || res.headers.get('Authorization');
        const body = await res.json().catch(() => ({}));
        if (!res.ok || body.code !== '0') {
          throw new Error(body.message || ('HTTP ' + res.status));
        }
        if (!auth) {
          throw new Error('Login succeeded but no authorization token was returned.');
        }
        localStorage.setItem('authorization', auth);
        msg.className = 'ok';
        msg.textContent = 'Signed in. Opening Workbench…';
        location.href = '/';
      } catch (e) {
        msg.className = 'err';
        msg.textContent = String(e.message || e);
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', signIn);
    document.getElementById('pass').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signIn();
    });
  </script>
</body>
</html>
