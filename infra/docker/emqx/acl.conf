%%--------------------------------------------------------------------
%% EMQX authorization rules (Plan 04 item 6, AUTH-03).
%%
%% First match wins; authorization.no_match = deny (set in compose) closes
%% everything not explicitly allowed here.
%%
%%   1. The Sparkplug edge node (ams_edge, authenticated against the built-in
%%      database) owns the spBv1.0 namespace: it publishes NBIRTH/DBIRTH/DDATA
%%      and must also be able to subscribe (NCMD/DCMD rebirth requests).
%%   2. Every other authenticated client (browsers presenting an RS256 JWT)
%%      is SUBSCRIBE-ONLY on spBv1.0/#. The publish deny covers ALL message
%%      types — including NCMD/DCMD device commands, which the plan calls out
%%      explicitly: a browser can never inject a device command.
%%--------------------------------------------------------------------

%% 1. Edge node: full access to the Sparkplug namespace.
{allow, {username, "ams_edge"}, all, ["spBv1.0/#"]}.

%% 2. Everyone else: read-only. Publish denied BEFORE the subscribe allow so a
%%    browser can never publish anything under spBv1.0 (NCMD/DCMD included).
{deny,  all, publish,   ["spBv1.0/#"]}.
{allow, all, subscribe, ["spBv1.0/#"]}.

%% Everything else falls through to authorization.no_match = deny.
