# Test broker for the ingestion-service connection test (E2E + manual UI testing).
# Authenticated (no anonymous) so the credential path is genuinely exercised —
# user/password are created at container start from MOSQUITTO_TEST_USER/PASSWORD
# (defaults ams_ingest / ams-ingest-test, see docker-compose.yml).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence false
