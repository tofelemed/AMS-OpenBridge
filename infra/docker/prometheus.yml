global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    env: dev

# ── Alerting (optional — enable when Alertmanager is running) ──────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# ── Scrape configs ──────────────────────────────────────────────────────────
scrape_configs:

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── AMS .NET Backend (ASP.NET Prometheus middleware) ──────────────────────
  # Requires Prometheus.AspNetCore NuGet in AMS.Api and app.MapMetrics().
  - job_name: ams-api
    static_configs:
      - targets: ["ams-api:8000"]
    metrics_path: /metrics

  # ── Historian BFF (.NET 8 Minimal API) ───────────────────────────────────
  - job_name: historian-bff
    static_configs:
      - targets: ["historian-bff:8090"]
    metrics_path: /metrics

  # ── Apache Flink JobManager ───────────────────────────────────────────────
  # Flink exposes Prometheus metrics on :9249 via the metrics.reporter.prom
  # plugin (enabled in FLINK_PROPERTIES below).
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["flink-jobmanager:9249"]

  # ── Apache Flink TaskManager ──────────────────────────────────────────────
  - job_name: flink-taskmanager
    static_configs:
      - targets: ["flink-taskmanager:9249"]

  # ── Apache IoTDB (built-in Prometheus endpoint :9091) ────────────────────
  # IoTDB 1.3.x ships /metrics on :9091 (enabled by default in standalone).
  - job_name: iotdb
    static_configs:
      - targets: ["iotdb:9091"]
    metrics_path: /metrics

  # ── EMQX Broker ──────────────────────────────────────────────────────────
  # EMQX 5.x exposes Prometheus pull endpoint on :18083/api/v5/prometheus/stats
  # (requires enabling in EMQX Dashboard → Integration → Prometheus).
  # Alternatively enable the push gateway or use the built-in exporter plugin.
  - job_name: emqx
    static_configs:
      - targets: ["emqx:18083"]
    metrics_path: /api/v5/prometheus/stats
    basic_auth:
      username: admin
      password: public

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Scraped via redis_exporter sidecar (added to compose in Phase 6).
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── PostgreSQL / TimescaleDB ──────────────────────────────────────────────
  # Scraped via postgres_exporter sidecar (added to compose in Phase 6).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Kafka (JMX Exporter via kafka-exporter) ───────────────────────────────
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
