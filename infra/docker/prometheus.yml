global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    env: dev

# ── Alerting (Plan 08) ──────────────────────────────────────────────────────
# Alertmanager runs in compose with a dev-null receiver; production only has to
# swap the receiver in alertmanager.yml — rules and routing are already wired.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

# ── Scrape configs ──────────────────────────────────────────────────────────
scrape_configs:

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── AMS .NET Backend (ASP.NET Prometheus middleware) ──────────────────────
  # Requires Prometheus.AspNetCore NuGet in AMS.Api and app.MapMetrics().
  - job_name: ams-api
    static_configs:
      - targets: ["ams-api:8000"]
    metrics_path: /metrics

  # ── Historian BFF (.NET 8 Minimal API) ───────────────────────────────────
  - job_name: historian-bff
    static_configs:
      - targets: ["historian-bff:8090"]
    metrics_path: /metrics

  # ── Apache Flink JobManager ───────────────────────────────────────────────
  # Flink exposes Prometheus metrics on :9249 via the metrics.reporter.prom
  # plugin (enabled in FLINK_PROPERTIES below).
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["flink-jobmanager:9249"]

  # ── Apache Flink TaskManager ──────────────────────────────────────────────
  - job_name: flink-taskmanager
    static_configs:
      - targets: ["flink-taskmanager:9249"]

  # ── Apache IoTDB (built-in Prometheus endpoint :9091) ────────────────────
  # IoTDB 1.3.x ships /metrics on :9091 (enabled by default in standalone).
  - job_name: iotdb
    static_configs:
      - targets: ["iotdb:9091"]
    metrics_path: /metrics

  # ── EMQX Broker — DISABLED (Plan 08 item 4) ──────────────────────────────
  # The job previously carried committed credentials (admin/public) that did not
  # match the broker's real dashboard password from .env — the target never
  # scraped successfully. Re-enable with an EMQX API key delivered via a
  # password_file (never committed) when broker metrics are actually needed.
  # - job_name: emqx
  #   static_configs:
  #     - targets: ["emqx:18083"]
  #   metrics_path: /api/v5/prometheus/stats

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Scraped via redis_exporter sidecar (added to compose in Phase 6).
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ── PostgreSQL / TimescaleDB ──────────────────────────────────────────────
  # Scraped via postgres_exporter sidecar (added to compose in Phase 6).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Kafka (JMX Exporter via kafka-exporter) ───────────────────────────────
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # ── API gateway (YARP; prometheus-net on /gw/metrics) ─────────────────────
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /gw/metrics

  # ── Traverse services that expose prometheus-net /metrics (Plan 08 item 1)
  # The remaining Traverse services (asset-model, binding-resolver, display,
  # template, analysis) and auth-service are not instrumented yet — add them
  # here the moment they get a /metrics endpoint; do not scrape blind targets.
  - job_name: audit-service
    static_configs:
      - targets: ["audit-service:8080"]
    metrics_path: /metrics

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8080"]
    metrics_path: /metrics

  - job_name: cplm-api
    static_configs:
      - targets: ["cplm-api:5000"]
    metrics_path: /metrics

  - job_name: ingestion-service
    static_configs:
      - targets: ["ingestion-service:5000"]
    metrics_path: /metrics
